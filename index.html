<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{background:#111;text-align:center;padding:8px;font-size:11px;color:#ddd}
nav{height:70px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0;background:#080808ee;backdrop-filter:blur(8px);z-index:50}
.logo{font-size:29px;font-weight:900;letter-spacing:6px;cursor:pointer}
.links{display:flex;gap:24px}
.links a{color:#aaa;text-decoration:none;font-size:13px;cursor:pointer}
.navActions{display:flex;align-items:center;gap:7px}
.langBtn{background:#222;color:#fff;border:0;border-radius:24px;padding:10px 15px}
.cartBtn{background:#fff;color:#111;border:0;border-radius:24px;padding:10px 17px}
.hero{min-height:550px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#555,#191919 48%,#070707 78%)}
.v{font-size:65px;font-weight:900}
.hero h1{font-size:75px;letter-spacing:9px;margin:0}
.hero p{letter-spacing:5px;color:#ddd}
.cta{background:#fff;color:#111;border:0;border-radius:30px;padding:15px 35px;font-weight:bold;margin-top:18px}
section{padding:50px 5%}
.title{font-size:27px;margin:0 0 8px}
.muted{color:#777;margin:0 0 25px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.cat{height:210px;border-radius:15px;padding:22px;display:flex;align-items:end;background:linear-gradient(145deg,#333,#111);font-size:21px;font-weight:800;cursor:pointer}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}
.search{width:260px;background:#111;color:#fff;border:1px solid #333;border-radius:25px;padding:11px 16px;outline:none}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#f4f4f4;color:#111;border-radius:13px;overflow:hidden;cursor:pointer}
.pic{height:245px;background:linear-gradient(145deg,#444,#111);display:grid;place-items:center;color:#fff;font-size:45px;font-weight:900;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;right:10px;background:#111;color:#fff;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:bold}
.info{padding:14px}
.info h3{margin:0 0 8px}
.price{font-weight:800;margin:8px 0;font-size:18px}
.oldPrice{text-decoration:line-through;color:#888;font-size:14px;margin-left:7px;font-weight:normal}
.salePercent{color:#b00020;font-size:12px;font-weight:bold;margin:7px 0}
.stock{font-size:12px;color:#777;margin-bottom:9px}
.add{width:100%;background:#111;color:#fff;border:0;padding:11px;border-radius:22px}
.add:disabled{opacity:.4;cursor:not-allowed}
.offersBtn{margin-top:18px;background:#222;color:#fff;border:1px solid #444;border-radius:25px;padding:11px 20px}
.banner{min-height:270px;border-radius:16px;display:grid;place-items:center;text-align:center;background:linear-gradient(90deg,#111,#444,#111)}
.banner h2{font-size:38px;letter-spacing:5px}
.features{background:#eee;color:#111;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px;text-align:center}
.features b{display:block;margin:5px}
footer{padding:45px 5%;border-top:1px solid #222;color:#999;display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:25px}
.flogo{font-size:28px;color:#fff;font-weight:900;letter-spacing:5px}

.productPage{padding:40px 5%;min-height:700px}
.back{background:#222;color:#fff;border:0;border-radius:22px;padding:10px 18px;margin-bottom:25px}
.productGrid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;max-width:1200px;margin:auto}
.galleryMain{height:560px;border-radius:18px;background:#111;overflow:hidden;display:grid;place-items:center}
.galleryMain img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;overflow:auto;margin-top:12px}
.thumb{width:80px;height:80px;border:2px solid #333;border-radius:9px;overflow:hidden;cursor:pointer;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.details h1{font-size:42px;margin:0 0 15px}
.descBox{margin:22px 0;padding:18px;border:1px solid #222;border-radius:12px;background:#0e0e0e}
.descTitle{font-size:20px;font-weight:800;margin:0 0 12px}
.desc{color:#ddd;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;min-height:20px}
.noDesc{color:#777;font-size:14px}
.bigPrice{font-size:28px;font-weight:900;margin:20px 0}
.optionTitle{margin-top:20px}
.options{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}
.optionBtn{background:#111;color:#fff;border:1px solid #444;border-radius:7px;padding:10px 18px}
.optionBtn.selected{background:#fff;color:#111}
.productQty{display:flex;align-items:center;gap:12px;margin:20px 0}
.productQty button{width:38px;height:38px;border:1px solid #555;background:#111;color:#fff;border-radius:7px}
.wide{width:100%;padding:15px;background:#fff;color:#111;border:0;border-radius:8px;font-weight:bold}

.reviews{max-width:1200px;margin:60px auto 0}
.reviewForm{background:#111;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:25px}
.reviewForm input,.reviewForm textarea{width:100%;padding:12px;background:#000;color:#fff;border:1px solid #333;border-radius:8px;margin:6px 0 10px;outline:none}
.ratingButtons{display:flex;gap:8px;margin:10px 0;font-size:20px}
.starBtn{background:#222;color:#777;border:0;border-radius:7px;padding:8px 12px;cursor:pointer}
.starBtn.selected{background:#fff;color:#000}
.reviewSubmit{width:100%;padding:13px;background:#fff;color:#111;border:0;border-radius:8px;font-weight:bold}
.reviewList{display:grid;gap:12px}
.review{background:#111;border:1px solid #222;border-radius:12px;padding:16px}
.reviewHead{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.reviewDate{font-size:11px;color:#777}
.reviewText{color:#ccc;line-height:1.7}

.cartPage{padding:40px 5%;max-width:1200px;margin:auto;min-height:700px}
.cartLayout{display:grid;grid-template-columns:1.5fr .8fr;gap:25px}
.cartBox,.checkoutBox{background:#fff;color:#111;border-radius:14px;padding:20px}
.cartItem{display:grid;grid-template-columns:80px 1fr auto auto;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #ddd}
.cartImg{width:80px;height:80px;border-radius:8px;overflow:hidden;background:#222;display:grid;place-items:center;color:#fff}
.cartImg img{width:100%;height:100%;object-fit:cover}
.qty{display:flex;gap:7px;align-items:center}
.qty button{border:1px solid #ccc;background:#fff;border-radius:5px;width:30px;height:30px}
.remove{border:0;background:none;color:#c00;cursor:pointer}
.checkoutBox input,.checkoutBox textarea,.checkoutBox select{width:100%;margin:7px 0;padding:12px;border:1px solid #ccc;border-radius:7px;outline:none}
.dark{width:100%;padding:13px;background:#111;color:#fff;border:0;border-radius:7px;cursor:pointer}
.dark:disabled{opacity:0.5;cursor:not-allowed}
.summaryLine{display:flex;justify-content:space-between;padding:8px 0}
.summaryTotal{font-size:21px;font-weight:bold;border-top:1px solid #ddd;padding-top:12px}
.couponRow{display:flex;gap:7px;margin:12px 0}
.couponRow input{flex:1;margin:0}
.couponRow button{border:0;background:#111;color:#fff;border-radius:7px;padding:0 15px}
.notice{padding:10px;border-radius:7px;background:#f2f2f2;margin:10px 0;font-size:13px}
.ok{background:#e7f7e7;color:#1b5e20}
.err{background:#ffe9e9;color:#c62828}
.empty{padding:50px;text-align:center;color:#777}
.recommended{margin-top:60px}

.offersPage{min-height:700px;padding:45px 5%}
.offersHeader{text-align:center;margin-bottom:35px}
.offersHeader h1{font-size:42px;margin:0 0 10px}
.offersHeader p{color:#777}

@media(max-width:800px){
.links{display:none}
.hero{min-height:500px}
.hero h1{font-size:48px}
.cats,.products{grid-template-columns:repeat(2,1fr)}
.features{grid-template-columns:repeat(2,1fr)}
footer{grid-template-columns:1fr 1fr}
.toolbar{display:block}
.search{width:100%;margin-top:10px}
.productGrid{grid-template-columns:1fr;gap:25px}
.galleryMain{height:420px}
.details h1{font-size:32px}
.cartLayout{grid-template-columns:1fr}

.oldPrice{font-size:11px}

.cats{gap:9px}
.cat{height:145px;font-size:16px;padding:14px}
.cartItem{grid-template-columns:65px 1fr;gap:10px}
.cartImg{width:65px;height:65px}
.offersHeader h1{font-size:32px}
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function jsEsc(v){
  return String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");
}

function money(v){
  return "EGP "+Number(v||0).toLocaleString();
}

function getImages(p){
  if(!p)return[];
  let a=[];
  if(Array.isArray(p.image_urls))a=p.image_urls;
  else if(typeof p.image_urls==="string"&&p.image_urls.trim()){
    try{
      const x=JSON.parse(p.image_urls);
      if(Array.isArray(x))a=x;
    }catch(e){
      a=p.image_urls.split(",").map(x=>x.trim()).filter(Boolean);
    }
  }
  if(!a.length&&p.image_url)a=[p.image_url];
  return a.filter(Boolean);
}

function getList(v){
  if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);
  if(v==null)return[];
  if(typeof v==="string"){
    const s=v.trim();
    if(!s)return[];
    try{
      const x=JSON.parse(s);
      if(Array.isArray(x))return x.map(x=>String(x).trim()).filter(Boolean);
    }catch(e){}
    return s.split(",").map(x=>x.trim()).filter(Boolean);
  }
  return[];
}

function getSizes(p){return getList(p?.sizes)}

function getColors(p){
  if(!p)return[];
  const c=getList(p.colors);
  return c.length?c:getList(p.color);
}

function salePrice(p){
  const n=Number(p?.price||0);
  const s=Number(p?.sale_price||0);
  return s>0&&s<n?s:n;
}

function discount(p){
  const n=Number(p?.price||0);
  const s=Number(p?.sale_price||0);
  return n>0&&s>0&&s<n?Math.round((n-s)/n*100):0;
}

function stars(v){
  const r=Math.max(0,Math.min(5,Number(v||0)));
  return "★".repeat(r)+"☆".repeat(5-r);
}

async function loadStoreSettings(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/site_settings?key=in.(free_shipping_min,shipping_rates,whatsapp,payment_methods,deposit_numbers)&select=key,value",{headers:HEADERS});
    if(!r.ok)return;
    const rows=await r.json();
    window.VANTA_PAYMENT_METHODS={cod:true,vodafone_cash:true,instapay:true};
    window.VANTA_DEPOSIT_NUMBERS={};
    for(const row of rows){
      if(row.key==="free_shipping_min") window.VANTA_FREE_SHIPPING_MIN=Number(row.value)||1500;
      if(row.key==="shipping_rates" && row.value && typeof row.value==="object"){
        Object.keys(SHIPPING_RATES).forEach(k=>delete SHIPPING_RATES[k]);
        Object.assign(SHIPPING_RATES,row.value);
      }
      if(row.key==="whatsapp") window.VANTA_WHATSAPP=String(row.value||"").replace(/\D/g,"");
      if(row.key==="payment_methods" && row.value && typeof row.value==="object") window.VANTA_PAYMENT_METHODS={...window.VANTA_PAYMENT_METHODS,...row.value};
      if(row.key==="deposit_numbers" && row.value && typeof row.value==="object") window.VANTA_DEPOSIT_NUMBERS=row.value;
    }
    const wa=window.VANTA_WHATSAPP||"";
    const waEl=document.getElementById("whatsappFloat");
    if(waEl && wa) waEl.href="https://wa.me/"+wa;
  }catch(e){ console.warn("settings",e); }
}

async function loadVariantInventory(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/product_variants?select=*",{headers:HEADERS});
    if(r.ok) variantInventory=await r.json();
  }catch(e){ variantInventory=[]; }
}
function getVariant(p,size="",color=""){
  if(!p||!variantInventory.length)return null;
  return variantInventory.find(v=>String(v.product_id)===String(p.id)&&String(v.size||"")===String(size||"")&&String(v.color||"")===String(color||""))||null;
}
function productVariantRows(p){
  return variantInventory.filter(v=>String(v.product_id)===String(p?.id));
}
function variantStock(p,size="",color=""){
  const rows=productVariantRows(p);
  if(!rows.length)return Number(p?.stock||0);
  const v=rows.find(x=>String(x.size||"")===String(size||"")&&String(x.color||"")===String(color||""));
  return v?Number(v.stock||0):0;
}
function availableSize(p,size){
  const rows=productVariantRows(p), colors=getColors(p);
  if(!rows.length||!colors.length)return true;
  return colors.some(c=>variantStock(p,size,c)>0);
}
function availableColor(p,color){
  const rows=productVariantRows(p), sizes=getSizes(p);
  if(!rows.length||!sizes.length)return true;
  return sizes.some(s=>variantStock(p,s,color)>0);
}
function totalProductStock(p){
  if(variantInventory.length){
    const rows=variantInventory.filter(v=>String(v.product_id)===String(p.id));
    if(rows.length)return rows.reduce((a,v)=>a+Number(v.stock||0),0);
  }
  return Number(p.stock||0);
}

function addProductToCart(){
  if(!selectedProduct)return;

  const sizes=getSizes(selectedProduct);
  const colors=getColors(selectedProduct);

  if(sizes.length&&!selectedSize){
    showChoiceError("sizeError",t("selectSizeError"));
    return;
  }

  if(colors.length&&!selectedColor){
    showChoiceError("colorError",t("selectColorError"));
    return;
  }

  const stock=variantStock(selectedProduct,selectedSize,selectedColor);
  if(stock<1){
    showChoiceError("sizeError",t("soldOutVariant"));
    return;
  }

  addToCart(selectedProduct,productQty,selectedSize,selectedColor);
  openCartPage();
}

function addToCart(p,q,size="",color=""){
  const stock=variantStock(p,size,color);
  if(stock<1)return false;

  const e=cart.find(i=>
    String(i.product_id)===String(p.id)&&
    String(i.size||"")===String(size||"")&&
    String(i.color||"")===String(color||"")
  );

  if(e){
    e.qty=Math.min(stock,Number(e.qty||1)+Number(q||1));
  }else{
    cart.push({
      cart_id:crypto.randomUUID(),
      product_id:p.id,
      name:p.name,
      price:salePrice(p),
      image_url:getImages(p)[0]||"",
      stock,
      qty:Number(q||1),
      size:size||"",
      color:color||""
    });
  }

  saveCart();
  return true;
}

function quickAddById(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;
  if(totalProductStock(p)<1)return;

  if(getSizes(p).length||getColors(p).length){
    return openProduct(id);
  }

  addToCart(p,1,"","");
  openCartPage();
}

function updateCount(){

  if(e)e.textContent=cart.reduce((s,i)=>s+Number(i.qty||1),0);
}

function subtotal(){
  return cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||1),0);
}

function couponDiscount(){
  if(!appliedCoupon)return 0;

  const s=subtotal();
  const type=String(appliedCoupon.discount_type||"").toLowerCase();
  const v=Number(appliedCoupon.discount_value||0);

  if(type==="percent"||type==="percentage")return Math.min(s,s*v/100);
  if(type==="fixed")return Math.min(s,v);
  return 0;
}

function total(){
  const sub = subtotal();
  if (sub >= Number(window.VANTA_FREE_SHIPPING_MIN||1500)) {
    selectedShippingCost = 0; // شحن مجاني
  }
  return Math.max(0, sub - couponDiscount() + selectedShippingCost);
}

async function applyCoupon(){
  const input=document.getElementById("couponInput");
  const msg=document.getElementById("couponMsg");

  if(!input||!msg)return;

  const code=input.value.trim().toUpperCase();

  if(!code){
    appliedCoupon=null;
    msg.className="notice err";
    msg.textContent=t("couponBad");
    refreshTotals();
    return;
  }

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/coupons?code=eq."+encodeURIComponent(code)+"&active=eq.true&select=*",
      {headers:HEADERS}
    );

    if(!r.ok)throw Error(await r.text());

    const d=await r.json();
    if(!d.length)throw Error("INVALID");

    const c=d[0];

    if(c.expires_at&&new Date(c.expires_at)<=new Date())throw Error("EXPIRED");

    if(
      c.max_uses!=null&&
      Number(c.max_uses)>0&&
      Number(c.used_count||0)>=Number(c.max_uses)
    )throw Error("MAX");

    if(subtotal()<Number(c.min_order||0))throw Error("MIN");

    const type=String(c.discount_type||"").toLowerCase();
    const v=Number(c.discount_value||0);

    if(v<=0||!["percent","percentage","fixed"].includes(type)){
      throw Error("INVALID");
    }

    appliedCoupon={
      ...c,
      discount_type:type==="percentage"?"percent":type
    };

    msg.className="notice ok";
    msg.textContent=t("couponOK");
    refreshTotals();

  }catch(e){
    console.error(e);
    appliedCoupon=null;
    msg.className="notice err";
    msg.textContent=t("couponBad");
    refreshTotals();
  }
}

function refreshTotals(){
  const s=document.getElementById("subtotal");
  const d=document.getElementById("discount");
  const sh=document.getElementById("shippingRate");
  const tt=document.getElementById("total");

  if(s)s.textContent=money(subtotal());
  if(d)d.textContent="-"+money(couponDiscount());
  if(sh)sh.textContent=subtotal() >= Number(window.VANTA_FREE_SHIPPING_MIN||1500) ? freeShippingText() : money(selectedShippingCost);
  if(tt)tt.textContent=money(total());
}

function placeOrder(){
  const msg=document.getElementById("orderMsg");
  const btn=document.getElementById("orderBtn");

  if(!msg)return;

  if(!cart.length){
    msg.className="notice err";
    msg.textContent=t("empty");
    return;
  }

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const whatsapp=document.getElementById("whatsapp").value.trim();
  const city=document.getElementById("city").value.trim();
  const address=document.getElementById("address").value.trim();
  const paymentMethod=document.getElementById("paymentMethod")?.value||"cod";
  const paymentReference=document.getElementById("paymentReference")?.value.trim()||null;

  if(!name||!phone||!whatsapp||!city||!address){
    msg.className="notice err";
    msg.textContent=t("required");
    return;
  }

  btn.disabled = true;
  msg.className="notice";
  msg.textContent=t("placingOrder");

  const payload={
    p_customer_name:name,
    p_phone:phone,
    p_whatsapp:whatsapp,
    p_city:city,
    p_address:address,
    p_items:cart.map(i=>({
      product_id:i.product_id,
      qty:Number(i.qty||1),
      size:i.size||"",
      color:i.color||""
    })),
    p_coupon_code:appliedCoupon?.code||null,
    p_latitude:customerLocation.latitude,
    p_longitude:customerLocation.longitude,
    p_map_url:customerLocation.map_url,
    p_payment_method:paymentMethod,
    p_payment_reference:paymentReference
  };

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/rpc/create_order",
      {
        method:"POST",
        headers:{...HEADERS,Prefer:"return=representation"},
        body:JSON.stringify(payload)
      }
    );

    if(!r.ok){
      const txt=await r.text();
      let friendly=language==="ar"

async function submitCustomPrint(){

  const raw=String(m||"");
  const map={
    CUSTOMER_NAME_REQUIRED:["اكتب الاسم أولًا","Name is required"],
    PHONE_REQUIRED:["اكتب رقم الهاتف","Phone number is required"],
    WHATSAPP_REQUIRED:["اكتب رقم الواتساب","WhatsApp number is required"],
    CITY_REQUIRED:["اختار المحافظة","Please choose a governorate"],
    ADDRESS_REQUIRED:["اكتب العنوان بالتفصيل","Detailed address is required"],
    EMPTY_CART:["السلة فاضية","Cart is empty"],
    PRODUCT_NOT_FOUND:["أحد المنتجات غير موجود","A product was not found"],
    PRODUCT_INACTIVE:["أحد المنتجات غير متاح حاليًا","A product is inactive"],
    INSUFFICIENT_STOCK:["الكمية المطلوبة غير متوفرة في المخزون","The requested quantity is not available"],
    VARIANT_NOT_FOUND:["اختيار المقاس واللون غير موجود في المخزون","This size/color combination is not available"],
    INVALID_SIZE:["المقاس المختار غير متاح","The selected size is not available"],
    INVALID_COLOR:["اللون المختار غير متاح","The selected color is not available"],
    INVALID_COUPON:["كود الخصم غير صالح","Invalid coupon code"],
    EXPIRED_COUPON:["كود الخصم منتهي الصلاحية","Coupon code has expired"],
    COUPON_LIMIT_REACHED:["الكوبون وصل للحد الأقصى من الاستخدام","Coupon usage limit has been reached"],
    MIN_ORDER_NOT_REACHED:["قيمة الطلب لا تحقق الحد الأدنى للكوبون","The order does not meet the coupon minimum"],
    PGRST202:["إعداد الطلب في Supabase غير مكتمل. شغّل ملف vanta_setup.sql مرة أخرى.","The order RPC is not configured. Run vanta_setup.sql again in Supabase."],
    ADMIN_REQUIRED:["هذا الحساب غير مضاف كأدمن في Supabase.","This account is not registered as an admin in Supabase."]
  };
  for(const key of Object.keys(map)){
    if(raw.includes(key)) return map[key][language==="ar"?0:1];
  }
  console.error("VANTA ORDER ERROR:",raw);
  return language==="ar" ? "تعذر تسجيل الطلب. راجع البيانات والمقاس/اللون والمخزون ثم حاول مرة أخرى." : "Could not place the order. Please check the details, size/color and stock, then try again.";
}

function goHome(){
  history.pushState(null,"",location.pathname);
  activeCategory="";
  render();
  scrollTo(0,0);
}

function goShop(){
  history.pushState(null,"",location.pathname+"#shop");
  render();
  const el=document.getElementById("shop");
  if(el)el.scrollIntoView({behavior:"smooth"});
}

function render(){
  applyLanguage();
  updateCount();
  const app=document.getElementById("app");
  const hash=location.hash;
  if(hash.startsWith("#product")){
    const params=new URLSearchParams(hash.split("?")[1]);
    const id=params.get("id");
    const p=products.find(x=>String(x.id)===String(id));
    if(p){app.innerHTML=productHTML(p);renderRecommended();loadReviews(p.id);}
    else {app.innerHTML=homeHTML();renderProducts();renderBestSelling();}
  }else if(hash==="#offers"){
    app.innerHTML=offersHTML();renderOffers();
  }else if(hash==="#cart"){
    app.innerHTML=cartHTML();renderCartItems();
  }else if(hash==="#custom-print"){
    app.innerHTML=customPrintHTML();
  }else if(hash==="#admin"){
    window.location.href="admin.html"; return;
  }else{
    app.innerHTML=homeHTML();renderProducts();renderBestSelling();
  }
}
window.addEventListener("popstate",render);
window.addEventListener("DOMContentLoaded",async()=>{
  activeCategory = "";
  applyLanguage();
  await Promise.all([loadVariantInventory(),loadProducts(),loadStoreSettings()]);
  render();
  updatePaymentOptions();
});
</script>
</body>
</html>
