function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function jsEsc(v){
  return String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");
}

function getImages(p){
  if(!p)return[];
  let a=[];
  if(Array.isArray(p.image_urls))a=p.image_urls;
  else if(typeof p.image_urls==="string"&&p.image_urls.trim()){
    try{
      const x=JSON.parse(p.image_urls);
      if(Array.isArray(x))a=x;
    }catch(e){
      a=p.image_urls.split(",").map(x=>x.trim()).filter(Boolean);
    }
  }
  if(!a.length&&p.image_url)a=[p.image_url];
  return a.filter(Boolean);
}

function getList(v){
  if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);
  if(v==null)return[];
  if(typeof v==="string"){
    const s=v.trim();
    if(!s)return[];
    try{
      const x=JSON.parse(s);
      if(Array.isArray(x))return x.map(x=>String(x).trim()).filter(Boolean);
    }catch(e){}
    return s.split(",").map(x=>x.trim()).filter(Boolean);
  }
  return[];
}

  const n=Number(p?.price||0);
  const s=Number(p?.sale_price||0);
  return n>0&&s>0&&s<n?Math.round((n-s)/n*100):0;
}

function stars(v){
  const r=Math.max(0,Math.min(5,Number(v||0)));
  return "★".repeat(r)+"☆".repeat(5-r);
}

  return p.name_en || p.name_ar || p.name || "Unnamed product";
}
function localizedCategory(c){
  const map={"T-Shirts":language==="ar"?"تيشيرتات":"T-Shirts",Hoodies:language==="ar"?"هوديز":"Hoodies",Pants:language==="ar"?"بناطيل":"Pants",Accessories:language==="ar"?"إكسسوارات":"Accessories"};
  return map[c]||c||"";
}
async function loadVariantInventory(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/product_variants?select=*",{headers:HEADERS});
    if(r.ok) variantInventory=await r.json();
  }catch(e){ variantInventory=[]; }
}
function getVariant(p,size="",color=""){
  if(!p||!variantInventory.length)return null;
  return variantInventory.find(v=>String(v.product_id)===String(p.id)&&String(v.size||"")===String(size||"")&&String(v.color||"")===String(color||""))||null;
}
function variantStock(p,size="",color=""){
  const vs=getSizes(p), vc=getColors(p);
  if(!vs.length&&!vc.length)return Number(p?.stock||0);
  const v=getVariant(p,size,color);
  return v?Number(v.stock||0):0;
}
function availableSize(p,size){
  const colors=getColors(p); if(!variantInventory.length||!colors.length)return true;
  return colors.some(c=>variantStock(p,size,c)>0);
}
function availableColor(p,color){
  const sizes=getSizes(p); if(!variantInventory.length||!sizes.length)return true;
  return sizes.some(s=>variantStock(p,s,color)>0);
}
function totalProductStock(p){
  if(variantInventory.length){
    const rows=variantInventory.filter(v=>String(v.product_id)===String(p.id));
    if(rows.length)return rows.reduce((a,v)=>a+Number(v.stock||0),0);
  }
  return Number(p.stock||0);
}

function addToCart(p,q,size="",color=""){
  const stock=variantStock(p,size,color);
  if(stock<1)return false;

  const e=cart.find(i=>
    String(i.product_id)===String(p.id)&&
    String(i.size||"")===String(size||"")&&
    String(i.color||"")===String(color||"")
  );

  if(e){
    e.qty=Math.min(stock,Number(e.qty||1)+Number(q||1));
  }else{
    cart.push({
      cart_id:crypto.randomUUID(),
      product_id:p.id,
      name:p.name,
      price:salePrice(p),
      image_url:getImages(p)[0]||"",
      stock,
      qty:Number(q||1),
      size:size||"",
      color:color||""
    });
  }

  saveCart();
  return true;
}

  const p=products.find(x=>String(x.id)===String(id));

  if(totalProductStock(p)<1)return;

  if(getSizes(p).length||getColors(p).length){
    return openProduct(id);
  }

  addToCart(p,1,"","");
  openCartPage();
}

function subtotal(){

}

function couponDiscount(){
  if(!appliedCoupon)return 0;

  const s=subtotal();
  const type=String(appliedCoupon.discount_type||"").toLowerCase();
  const v=Number(appliedCoupon.discount_value||0);

  if(type==="percent"||type==="percentage")return Math.min(s,s*v/100);
  if(type==="fixed")return Math.min(s,v);
  return 0;
}

function total(){

  if (sub >= 1500) {
    selectedShippingCost = 0; // شحن مجاني

  return Math.max(0, sub - couponDiscount() + selectedShippingCost);
}

async function applyCoupon(){
  const input=document.getElementById("couponInput");
  const msg=document.getElementById("couponMsg");

  if(!input||!msg)return;

  const code=input.value.trim().toUpperCase();

  if(!code){
    appliedCoupon=null;
    msg.className="notice err";
    msg.textContent=t("couponBad");
    refreshTotals();
    return;
  }

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/coupons?code=eq."+encodeURIComponent(code)+"&active=eq.true&select=*",
      {headers:HEADERS}
    );

    if(!r.ok)throw Error(await r.text());

    const d=await r.json();
    if(!d.length)throw Error("INVALID");

    const c=d[0];

    if(c.expires_at&&new Date(c.expires_at)<=new Date())throw Error("EXPIRED");

    if(
      c.max_uses!=null&&
      Number(c.max_uses)>0&&
      Number(c.used_count||0)>=Number(c.max_uses)
    )throw Error("MAX");

    if(subtotal()<Number(c.min_order||0))throw Error("MIN");

    const type=String(c.discount_type||"").toLowerCase();
    const v=Number(c.discount_value||0);

    if(v<=0||!["percent","percentage","fixed"].includes(type)){
      throw Error("INVALID");
    }

    appliedCoupon={
      ...c,
      discount_type:type==="percentage"?"percent":type
    };

    msg.className="notice ok";
    msg.textContent=t("couponOK");
    refreshTotals();

  }catch(e){
    console.error(e);
    appliedCoupon=null;
    msg.className="notice err";
    msg.textContent=t("couponBad");
    refreshTotals();
  }
}

function refreshTotals(){
  const s=document.getElementById("subtotal");
  const d=document.getElementById("discount");
  const sh=document.getElementById("shippingRate");
  const tt=document.getElementById("total");

  if(s)s.textContent=money(subtotal());
  if(d)d.textContent="-"+money(couponDiscount());
  if(sh)sh.textContent=subtotal() >= 1500 ? "مجاناً 🚚" : money(selectedShippingCost);
  if(tt)tt.textContent=money(total());
}

async function placeOrder(){
  const msg=document.getElementById("orderMsg");
  const btn=document.getElementById("orderBtn");

  if(!msg)return;

  if(!cart.length){
    msg.className="notice err";
    msg.textContent=t("empty");
    return;
  }

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const whatsapp=document.getElementById("whatsapp").value.trim();
  const city=document.getElementById("city").value.trim();
  const address=document.getElementById("address").value.trim();

  if(!name||!phone||!whatsapp||!city||!address){
    msg.className="notice err";
    msg.textContent=t("required");
    return;
  }

  btn.disabled = true;
  msg.className="notice";
  msg.textContent=language==="ar"?"جاري تسجيل الطلب...":"Placing order...";

  const payload={
    p_customer_name:name,
    p_phone:phone,
    p_whatsapp:whatsapp,
    p_city:city,
    p_address:address,
    p_items:cart.map(i=>({
      product_id:i.product_id,
      qty:Number(i.qty||1),
      size:i.size||"",
      color:i.color||""
    })),
    p_coupon_code:appliedCoupon?.code||null
  };

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/rpc/create_order",
      {
        method:"POST",
        headers:{...HEADERS,Prefer:"return=representation"},
        body:JSON.stringify(payload)
      }
    );

    if(!r.ok){
      const txt=await r.text();
      let friendly=language==="ar"
        ?"تعذر إنشاء الطلب. تأكد من البيانات والمخزون والكوبون."
        :"Could not place the order. Please check the details, stock and coupon.";

      try{
        const j=JSON.parse(txt);
        if(j.message)friendly=mapOrderError(j.message);
      }catch(e){}

      throw Error(friendly);
    }

    const result=await r.json();
    const order=Array.isArray(result)?result[0]:result;

    lastOrder=order;
    pendingOrderInvoice=order;
    msg.className="successBox";
    msg.innerHTML=`<b>${t("orderThanks")}</b><br>${t("orderDelivery")}<br>${t("orderWhatsApp")}<br><b>${order?.order_number?((language==="ar"?"رقم الطلب: ":"Order #: ")+esc(order.order_number)):""}</b><div class="successActions"><button class="dark" onclick="downloadInvoice()">${t("downloadInvoice")}</button><button class="dark" onclick="goHome()">${t("backHome")}</button></div>`;

    await createNotification(order);
    cart=[];
    appliedCoupon=null;
    selectedShippingCost=0;
    localStorage.removeItem("vanta_cart");
    updateCount();
    renderCartItems();
    refreshTotals();
    setTimeout(()=>goHome(),5000);

  }catch(e){
    msg.className="notice err";
    msg.textContent=e.message||t("error");
  } finally {
    btn.disabled = false;
  }
}

async function submitCustomPrint(){
  const msg=document.getElementById("cpMsg"), files=document.getElementById("cpFiles")?.files||[];
  const name=document.getElementById("cpName").value.trim(),phone=document.getElementById("cpPhone").value.trim(),wa=document.getElementById("cpWhats").value.trim(),city=document.getElementById("cpCity").value,address=document.getElementById("cpAddress").value.trim(),details=document.getElementById("cpDetails").value.trim(),deposit=Number(document.getElementById("cpDeposit").value||0);
  if(!name||!phone||!wa||!city||!address||!details){msg.className="notice err";msg.textContent=t("required");return}
  msg.className="notice";msg.textContent=language==="ar"?"جاري إرسال الطلب...":"Sending...";
  try{
    const fileUrls=[];
    // Uploads require a public Supabase Storage bucket named print-files. If unavailable, keep file names and ask admin to configure bucket.
    for(const f of files){
      const path=`${Date.now()}-${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g,"_")}`;
      const rr=await fetch(`${SUPABASE_URL}/storage/v1/object/print-files/${path}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":f.type||"application/octet-stream"},body:f});
      if(rr.ok) fileUrls.push(`${SUPABASE_URL}/storage/v1/object/public/print-files/${path}`); else fileUrls.push("FILE:"+f.name);
    }
    const r=await fetch(SUPABASE_URL+"/rest/v1/custom_print_orders",{method:"POST",headers:{...HEADERS,Prefer:"return=representation"},body:JSON.stringify({customer_name:name,phone,whatsapp:wa,city,address,details,deposit,file_urls:fileUrls,status:"new"})});
    if(!r.ok)throw Error(await r.text());
    msg.className="successBox";msg.innerHTML=`<b>${t("customSuccess")}</b><br><button class="dark" onclick="goHome()">${t("backHome")}</button>`;
  }catch(e){console.error(e);msg.className="notice err";msg.textContent=language==="ar"?"تعذر إرسال طلب الطباعة. تأكد من إعداد Storage والجدول في Supabase.":"Could not send print request. Check Supabase Storage/table setup."}
}

async function loadAdminCustom(){const p=document.getElementById("adminPanel");try{const r=await adminFetch("custom_print_orders?select=*&order=created_at.desc&limit=100");const rows=await r.json();p.innerHTML=`<div class="adminCard"><h2>🖨️ طلبات الطباعة</h2><table class="adminTable"><tr><th>العميل</th><th>التفاصيل</th><th>العربون</th><th>الملفات</th><th>الحالة</th></tr>${rows.map(o=>`<tr><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.whatsapp)}</td><td>${esc(o.details)}</td><td>${money(o.deposit)}</td><td>${(Array.isArray(o.file_urls)?o.file_urls:[]).map(u=>u.startsWith('http')?`<a href="${esc(u)}" target="_blank">ملف</a>`:esc(u)).join('<br>')}</td><td>${esc(o.status||'new')}</td></tr>`).join("")}</table></div>`}catch(e){p.innerHTML='<div class="notice err">تعذر تحميل طلبات الطباعة.</div>'}}
async function loadAdminSettings(){const p=document.getElementById("adminPanel");p.innerHTML=`<div class="adminCard"><h2>⚙️ الإعدادات</h2><label class="fieldLabel">حد الشحن المجاني</label><input id="setFree" type="number" value="1500"><label class="fieldLabel">رقم واتساب</label><input id="setWhats" value="201000000000"><button class="wide" style="margin-top:12px" onclick="saveBasicSettings()">حفظ</button><div id="setMsg"></div></div>`}
async function saveBasicSettings(){const m=document.getElementById('setMsg');try{let rates;try{rates=JSON.parse(document.getElementById('setRates').value)}catch(e){throw Error('JSON غير صحيح')} const val={free_shipping_min:Number(document.getElementById('setFree').value||1500),whatsapp:document.getElementById('setWhats').value.trim(),shipping_rates:rates};for(const [key,value] of Object.entries(val)){await adminFetch(`site_settings?key=eq.${encodeURIComponent(key)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({value})})}m.className='notice ok';m.textContent='تم حفظ الإعدادات';}catch(e){m.className='notice err';m.textContent='تعذر حفظ الإعدادات';}}
async function loadBestSellers(){return []}

function mapOrderError(m){
  const map={
    CUSTOMER_NAME_REQUIRED: language==="ar"?"اكتب الاسم أولًا":"Name is required",
    PHONE_REQUIRED: language==="ar"?"اكتب رقم الهاتف":"Phone number is required",
    WHATSAPP_REQUIRED: language==="ar"?"اكتب رقم الواتساب":"WhatsApp number is required",
    CITY_REQUIRED: language==="ar"?"اختار المحافظة":"City is required",
    ADDRESS_REQUIRED: language==="ar"?"اكتب العنوان بالتفصيل":"Detailed address is required",
    EMPTY_CART: language==="ar"?"السلة فاضية":"Cart is empty",
    PRODUCT_NOT_FOUND: language==="ar"?"أحد المنتجات غير موجود":"One of the products was not found",
    PRODUCT_INACTIVE: language==="ar"?"أحد المنتجات غير متاح حاليًا":"One of the products is inactive",
    OUT_OF_STOCK: language==="ar"?"عذرًا، أحد المنتجات نفذ من المخزون":"Sorry, an item is out of stock",
    INVALID_COUPON: language==="ar"?"كود الخصم غير صالح":"Invalid coupon code",
    EXPIRED_COUPON: language==="ar"?"كود الخصم منتهي الصلاحية":"Coupon code has expired"
  };
  return map[m] || (language==="ar"?"حدث خطأ غير معروف":"An unknown error occurred");
}

function goHome(){
  history.pushState(null,"",location.pathname);
  activeCategory="";
  render();
  scrollTo(0,0);
}

function goShop(){
  history.pushState(null,"",location.pathname+"#shop");
  render();
  const el=document.getElementById("shop");
  if(el)el.scrollIntoView({behavior:"smooth"});
}

function render(){
  applyLanguage();
  updateCount();
  const app=document.getElementById("app");
  const hash=location.hash;
  if(hash.startsWith("#product")){
    const params=new URLSearchParams(hash.split("?")[1]);
    const id=params.get("id");
    const p=products.find(x=>String(x.id)===String(id));
    if(p){app.innerHTML=productHTML(p);renderRecommended();loadReviews(p.id);}
    else {app.innerHTML=homeHTML();renderProducts();renderBestSelling();}
  }else if(hash==="#offers"){
    app.innerHTML=offersHTML();renderOffers();
  }else if(hash==="#cart"){
    app.innerHTML=cartHTML();renderCartItems();
  }else if(hash==="#custom-print"){
    app.innerHTML=customPrintHTML();
  }else if(hash==="#admin"){
    app.innerHTML=adminHTML();adminInit();
  }else{
    app.innerHTML=homeHTML();renderProducts();renderBestSelling();
  }
}
window.addEventListener("popstate",render);
window.addEventListener("DOMContentLoaded",async()=>{
  activeCategory = "";
  applyLanguage();
  await Promise.all([loadVariantInventory(),loadProducts()]);
  render();
});
</script>
