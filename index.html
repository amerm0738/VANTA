function t(k){return TXT[language][k]||k}

function applyLanguage(){
  document.documentElement.lang=language;
  document.documentElement.dir=language==="ar"?"rtl":"ltr";
  const b=document.getElementById("langBtn");
  if(b)b.textContent=language==="ar"?"EN":"AR";
}

function toggleLanguage(){
  language=language==="ar"?"en":"ar";
  localStorage.setItem("vanta_lang",language);
  applyLanguage();
  render();
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function jsEsc(v){
  return String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");
}

function money(v){
  return "EGP "+Number(v||0).toLocaleString();
}

function getImages(p){
  if(!p)return[];
  let a=[];
  if(Array.isArray(p.image_urls))a=p.image_urls;
  else if(typeof p.image_urls==="string"&&p.image_urls.trim()){
    try{
      const x=JSON.parse(p.image_urls);
      if(Array.isArray(x))a=x;
    }catch(e){
      a=p.image_urls.split(",").map(x=>x.trim()).filter(Boolean);
    }
  }
  if(!a.length&&p.image_url)a=[p.image_url];
  return a.filter(Boolean);
}

function getList(v){
  if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);
  if(v==null)return[];
  if(typeof v==="string"){
    const s=v.trim();
    if(!s)return[];
    try{
      const x=JSON.parse(s);
      if(Array.isArray(x))return x.map(x=>String(x).trim()).filter(Boolean);
    }catch(e){}
    return s.split(",").map(x=>x.trim()).filter(Boolean);
  }
  return[];
}

function getSizes(p){return getList(p?.sizes)}

function getColors(p){
  if(!p)return[];
  const c=getList(p.colors);
  return c.length?c:getList(p.color);
}

function salePrice(p){
  const n=Number(p?.price||0);
  const s=Number(p?.sale_price||0);
  return s>0&&s<n?s:n;
}

function discount(p){
  const n=Number(p?.price||0);
  const s=Number(p?.sale_price||0);
  return n>0&&s>0&&s<n?Math.round((n-s)/n*100):0;
}

function stars(v){
  const r=Math.max(0,Math.min(5,Number(v||0)));
  return "★".repeat(r)+"☆".repeat(5-r);
}

function productCard(p){
  const imgs=getImages(p);
  const d=discount(p);
  const stock=Number(p.stock||0);

  return `

<div class="stock">${stock>0?t("available")+" : "+stock:t("out")}</div>
<button class="add" ${stock<1?"disabled":""} onclick="event.stopPropagation();quickAddById('${jsEsc(p.id)}')">

async function loadProducts(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=*",{headers:HEADERS});
    if(!r.ok)throw Error(await r.text());
    products=await r.json();
    render();
  }catch(e){
    console.error(e);
    const app = document.getElementById("app");
    if(app) app.innerHTML=`<section><div class="notice err">تعذر تحميل المنتجات من Supabase.</div></section>`;
  }
}

function renderProducts(){
  const box=document.getElementById("products");
  if(!box)return;

  const q=(document.getElementById("search")?.value||"").trim().toLowerCase();
  let list=products.filter(p=>p.active!==false);

  if(q){
    list=list.filter(p=>{
      const text=[
        p.name,p.description,p.details,p.category,p.color
      ].map(x=>String(x||"").toLowerCase()).join(" ");
      return text.includes(q);
    });
  }

  if(activeCategory){
    list=list.filter(p=>String(p.category||"").toLowerCase()===activeCategory.toLowerCase());
  }

  box.innerHTML=list.length
    ?list.map(productCard).join("")
    :`<div class="empty">لا توجد منتجات.</div>`;
}

  b.innerHTML=a.length
    ?a.map(productCard).join("")
    :`<div class="empty">${t("noOffers")}</div>`;
}

function openProduct(id){
  history.pushState(null,"",location.pathname+location.search+"#product?id="+encodeURIComponent(id));
  render();
  scrollTo(0,0);
}

${sizes.length?`

function changeMainImage(u){
  const i=document.getElementById("mainImage");
  if(i)i.src=u;
}

function selectSize(v){
  selectedSize=v;
  document.querySelectorAll(".sizeBtn").forEach(b=>
    b.classList.toggle("selected",b.dataset.value===v)
  );
}

function selectColor(v){
  selectedColor=v;
  document.querySelectorAll(".colorBtn").forEach(b=>
    b.classList.toggle("selected",b.dataset.value===v)
  );
}

function productQtyChange(a){
  if(!selectedProduct)return;
  const max=Math.max(1,Number(selectedProduct.stock||1));
  productQty=Math.max(1,Math.min(max,productQty+a));
  const e=document.getElementById("productQty");
  if(e)e.textContent=productQty;
}

function setRating(val, btn){
  selectedRating = val;
  document.querySelectorAll(".starBtn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}

async function loadReviews(productId){
  const box = document.getElementById("reviewArea");
  if(!box) return;

  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/reviews?product_id=eq." + encodeURIComponent(productId) + "&select=*", {headers: HEADERS});
    if(!r.ok) throw Error();
    const list = await r.json();

    if(!list.length){
      box.innerHTML = `<div class="notice">${t("noReviews")}</div>`;
      return;
    }

    box.innerHTML = `<div class="reviewList">` + list.map(rev => `
      <div class="review">
        <div class="reviewHead">
          <b>${esc(rev.customer_name || "عميل")}</b>
          <span style="color:#fbc02d">${stars(rev.rating)}</span>
        </div>
        <div class="reviewText">${esc(rev.comment || "")}</div>
        <div class="reviewDate">${new Date(rev.created_at).toLocaleDateString()}</div>
      </div>
    `).join("") + `</div>`;

  } catch(e) {
    box.innerHTML = `<div class="notice">${t("noReviews")}</div>`;
  }
}

async function submitReview(){
  const msg = document.getElementById("reviewMsg");
  const name = document.getElementById("reviewerName").value.trim();
  const comment = document.getElementById("reviewerComment").value.trim();

  if(!name || !comment){
    msg.className = "notice err";
    msg.textContent = t("required");
    return;
  }

  try {
    const payload = {
      product_id: selectedProduct.id,
      customer_name: name,
      comment: comment,
      rating: selectedRating
    };

    const r = await fetch(SUPABASE_URL + "/rest/v1/reviews", {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify(payload)
    });

    if(!r.ok) throw Error();

    msg.className = "notice ok";
    msg.textContent = t("reviewSuccess");
    document.getElementById("reviewerName").value = "";
    document.getElementById("reviewerComment").value = "";
    loadReviews(selectedProduct.id);

  } catch(e) {
    msg.className = "notice err";
    msg.textContent = t("reviewError");
  }
}

function addProductToCart(){
  if(!selectedProduct)return;

  const stock=Number(selectedProduct.stock||0);
  if(stock<1)return;

  const sizes=getSizes(selectedProduct);
  const colors=getColors(selectedProduct);

  if(sizes.length&&!selectedSize){
    return alert(language==="ar"?"اختار المقاس أولًا":"Please choose a size first");
  }

  if(colors.length&&!selectedColor){
    return alert(language==="ar"?"اختار اللون أولًا":"Please choose a color first");
  }

  addToCart(selectedProduct,productQty,selectedSize,selectedColor);
  openCartPage();
}

function addToCart(p,q,size="",color=""){
  const stock=Number(p.stock||0);

  const e=cart.find(i=>
    String(i.product_id)===String(p.id)&&
    String(i.size||"")===String(size||"")&&
    String(i.color||"")===String(color||"")
  );

  if(e){
    e.qty=Math.min(stock,Number(e.qty||1)+Number(q||1));
  }else{
    cart.push({
      cart_id:crypto.randomUUID(),
      product_id:p.id,
      name:p.name,
      price:salePrice(p),
      image_url:getImages(p)[0]||"",
      stock,
      qty:Number(q||1),
      size:size||"",
      color:color||""
    });
  }

  saveCart();
}

function quickAddById(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;
  if(Number(p.stock||0)<1)return;

  if(getSizes(p).length||getColors(p).length){
    return openProduct(id);
  }

  addToCart(p,1,"","");
  openCartPage();
}

function renderRecommended(){
  const b=document.getElementById("recommendedProducts");
  if(!b||!selectedProduct)return;

  b.innerHTML=products
    .filter(p=>String(p.id)!==String(selectedProduct.id)&&p.active!==false)
    .slice(0,4)
    .map(productCard)
    .join("");
}

function saveCart(){
  localStorage.setItem("vanta_cart",JSON.stringify(cart));
  updateCount();
}

function updateCount(){
  const e=document.getElementById("count");
  if(e)e.textContent=cart.reduce((s,i)=>s+Number(i.qty||1),0);
}

function subtotal(){
  return cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||1),0);
}

function couponDiscount(){
  if(!appliedCoupon)return 0;

  const s=subtotal();
  const type=String(appliedCoupon.discount_type||"").toLowerCase();
  const v=Number(appliedCoupon.discount_value||0);

  if(type==="percent"||type==="percentage")return Math.min(s,s*v/100);
  if(type==="fixed")return Math.min(s,v);
  return 0;
}

function total(){
  const sub = subtotal();
  if (sub >= 1500) {
    selectedShippingCost = 0; // شحن مجاني
  }
  return Math.max(0, sub - couponDiscount() + selectedShippingCost);
}

function cartHTML(){
return `
<section class="cartPage">
<h1>${t("cart")}</h1>

${!cart.length
?`
<div class="cartBox empty">
${t("empty")}<br><br>
<button class="dark" onclick="goShop()">${t("shop")}</button>
</div>
`
:`
<div class="cartLayout">
<div class="cartBox">
<div id="cartItems"></div>
</div>

<div class="checkoutBox">
<h2>${t("order")}</h2>

<div class="summaryLine">
<span>${t("subtotal")}</span>
<b id="subtotal">${money(subtotal())}</b>
</div>

<div class="couponRow">
<input id="couponInput" placeholder="${t("coupon")}">
<button onclick="applyCoupon()">${t("apply")}</button>
</div>

<div id="couponMsg"></div>

<div class="summaryLine">

</div>

<hr>

${Object.keys(SHIPPING_RATES).map(c=>`<option value="${c}">${c}</option>`).join("")}
</select>

function updateShipping(city){
  if(subtotal() >= 1500){
    selectedShippingCost = 0;
  } else {
    selectedShippingCost = SHIPPING_RATES[city] || 0;
  }
  refreshTotals();
}

function renderCartItems(){
  const b=document.getElementById("cartItems");
  if(!b)return;

  b.innerHTML=cart.map((i,n)=>`
<div class="cartItem">
<div class="cartImg">
${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:"VANTA"}
</div>

<div>
<b>${esc(i.name)}</b><br>
${i.size?"المقاس: "+esc(i.size)+"<br>":""}
${i.color?"اللون: "+esc(i.color):""}
<br>${money(i.price)}
</div>

<div class="qty">
<button onclick="changeQty(${n},-1)">−</button>

<button onclick="changeQty(${n},1)">+</button>
</div>

<button class="remove" onclick="removeItem(${n})">${t("remove")}</button>
</div>
`).join("");
}

function openCartPage(){
  history.pushState(null,"",location.pathname+location.search+"#cart");
  render();
  scrollTo(0,0);
}

function changeQty(i,a){
  const x=cart[i];
  if(!x)return;

  x.qty=Math.max(
    1,
    Math.min(Number(x.stock||999999),Number(x.qty||1)+a)
  );

  saveCart();
  renderCartItems();
  refreshTotals();
}

function removeItem(i){
  cart.splice(i,1);
  saveCart();
  render();
}

async function applyCoupon(){
  const input=document.getElementById("couponInput");
  const msg=document.getElementById("couponMsg");

  if(!input||!msg)return;

  const code=input.value.trim().toUpperCase();

  if(!code){
    appliedCoupon=null;
    msg.className="notice err";
    msg.textContent=t("couponBad");
    refreshTotals();
    return;
  }

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/coupons?code=eq."+encodeURIComponent(code)+"&active=eq.true&select=*",
      {headers:HEADERS}
    );

    if(!r.ok)throw Error(await r.text());

    const d=await r.json();
    if(!d.length)throw Error("INVALID");

    const c=d[0];

    if(c.expires_at&&new Date(c.expires_at)<=new Date())throw Error("EXPIRED");

    if(
      c.max_uses!=null&&
      Number(c.max_uses)>0&&
      Number(c.used_count||0)>=Number(c.max_uses)
    )throw Error("MAX");

    if(subtotal()<Number(c.min_order||0))throw Error("MIN");

    const type=String(c.discount_type||"").toLowerCase();
    const v=Number(c.discount_value||0);

    if(v<=0||!["percent","percentage","fixed"].includes(type)){
      throw Error("INVALID");
    }

    appliedCoupon={
      ...c,
      discount_type:type==="percentage"?"percent":type
    };

    msg.className="notice ok";
    msg.textContent=t("couponOK");
    refreshTotals();

  }catch(e){
    console.error(e);
    appliedCoupon=null;
    msg.className="notice err";
    msg.textContent=t("couponBad");
    refreshTotals();
  }
}

function refreshTotals(){
  const s=document.getElementById("subtotal");
  const d=document.getElementById("discount");
  const sh=document.getElementById("shippingRate");
  const tt=document.getElementById("total");

  if(s)s.textContent=money(subtotal());
  if(d)d.textContent="-"+money(couponDiscount());
  if(sh)sh.textContent=subtotal() >= 1500 ? "مجاناً 🚚" : money(selectedShippingCost);
  if(tt)tt.textContent=money(total());
}

async function placeOrder(){
  const msg=document.getElementById("orderMsg");
  const btn=document.getElementById("orderBtn");

  if(!msg)return;

  if(!cart.length){
    msg.className="notice err";
    msg.textContent=t("empty");
    return;
  }

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const whatsapp=document.getElementById("whatsapp").value.trim();
  const city=document.getElementById("city").value.trim();
  const address=document.getElementById("address").value.trim();

  if(!name||!phone||!whatsapp||!city||!address){
    msg.className="notice err";
    msg.textContent=t("required");
    return;
  }

  btn.disabled = true;
  msg.className="notice";
  msg.textContent=language==="ar"?"جاري تسجيل الطلب...":"Placing order...";

  const payload={
    p_customer_name:name,
    p_phone:phone,
    p_whatsapp:whatsapp,
    p_city:city,
    p_address:address,
    p_items:cart.map(i=>({
      product_id:i.product_id,
      qty:Number(i.qty||1),
      size:i.size||"",
      color:i.color||""
    })),
    p_coupon_code:appliedCoupon?.code||null
  };

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/rpc/create_order",
      {
        method:"POST",
        headers:{...HEADERS,Prefer:"return=representation"},
        body:JSON.stringify(payload)
      }
    );

    if(!r.ok){
      const txt=await r.text();
      let friendly=language==="ar"
        ?"تعذر إنشاء الطلب. تأكد من البيانات والمخزون والكوبون."
        :"Could not place the order. Please check the details, stock and coupon.";

      try{
        const j=JSON.parse(txt);
        if(j.message)friendly=mapOrderError(j.message);
      }catch(e){}

      throw Error(friendly);
    }

    const result=await r.json();
    const order=Array.isArray(result)?result[0]:result;

    msg.className="notice ok";
    msg.textContent=order?.order_number
      ?t("success")+" رقم الطلب: "+order.order_number
      :t("success");

    cart=[];
    appliedCoupon=null;
    selectedShippingCost=0;
    localStorage.removeItem("vanta_cart");
    updateCount();
    renderCartItems();
    refreshTotals();

  }catch(e){
    msg.className="notice err";
    msg.textContent=e.message||t("error");
  } finally {
    btn.disabled = false;
  }
}

function mapOrderError(m){
  const map={
    CUSTOMER_NAME_REQUIRED: language==="ar"?"اكتب الاسم أولًا":"Name is required",
    PHONE_REQUIRED: language==="ar"?"اكتب رقم الهاتف":"Phone number is required",
    WHATSAPP_REQUIRED: language==="ar"?"اكتب رقم الواتساب":"WhatsApp number is required",
    CITY_REQUIRED: language==="ar"?"اختار المحافظة":"City is required",
    ADDRESS_REQUIRED: language==="ar"?"اكتب العنوان بالتفصيل":"Detailed address is required",
    EMPTY_CART: language==="ar"?"السلة فاضية":"Cart is empty",
    PRODUCT_NOT_FOUND: language==="ar"?"أحد المنتجات غير موجود":"One of the products was not found",
    PRODUCT_INACTIVE: language==="ar"?"أحد المنتجات غير متاح حاليًا":"One of the products is inactive",
    OUT_OF_STOCK: language==="ar"?"عذرًا، أحد المنتجات نفذ من المخزون":"Sorry, an item is out of stock",
    INVALID_COUPON: language==="ar"?"كود الخصم غير صالح":"Invalid coupon code",
    EXPIRED_COUPON: language==="ar"?"كود الخصم منتهي الصلاحية":"Coupon code has expired"
  };
  return map[m] || (language==="ar"?"حدث خطأ غير معروف":"An unknown error occurred");
}

function goHome(){
  history.pushState(null,"",location.pathname);
  activeCategory="";
  render();
  scrollTo(0,0);
}

function goShop(){
  history.pushState(null,"",location.pathname+"#shop");
  render();
  const el=document.getElementById("shop");
  if(el)el.scrollIntoView({behavior:"smooth"});
}

function render(){
  applyLanguage();
  updateCount();
  const app=document.getElementById("app");
  const hash=location.hash;

  if(hash.startsWith("#product")){
    const params=new URLSearchParams(hash.split("?")[1]);
    const id=params.get("id");
    const p=products.find(x=>String(x.id)===String(id));
    if(p){
      app.innerHTML=productHTML(p);
      renderRecommended();
      loadReviews(p.id);
    }else{
      app.innerHTML=homeHTML();
      renderProducts();
    }
  }else if(hash==="#offers"){
    app.innerHTML=offersHTML();
    renderOffers();
  }else if(hash==="#cart"){
    app.innerHTML=cartHTML();
    renderCartItems();
  }else{
    app.innerHTML=homeHTML();
    renderProducts();
  }
}

window.addEventListener("popstate",render);
window.addEventListener("DOMContentLoaded",()=>{
  if (location.hash) {
    history.replaceState(null, "", location.pathname);
  }
  activeCategory = "";
  applyLanguage();
  loadProducts();
});
</script>
