function esc(value){

return String(value??"")
.replace(/[&<>"']/g,function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];

});

}


function jsEsc(value){

return String(value??"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


function money(value){

function getImages(product){

if(!product)return[];

let arr=[];
const value=product.image_urls;

if(Array.isArray(value)){
arr=value;
}

else if(
typeof value==="string" &&
value.trim()
){

try{

const parsed=
JSON.parse(value);

if(Array.isArray(parsed)){
arr=parsed;
}

}catch(e){

arr=value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

}

if(
!arr.length &&
product.image_url
){

arr=[product.image_url];

}

return arr.filter(Boolean);

}


function getList(value){

if(Array.isArray(value)){

return value
.map(x=>String(x).trim())
.filter(Boolean);

}

if(
value===null||
value===undefined
){
return[];
}

if(typeof value==="string"){

const text=value.trim();

if(!text)return[];

try{

const parsed=
JSON.parse(text);

if(Array.isArray(parsed)){

return parsed
.map(x=>String(x).trim())
.filter(Boolean);

}

}catch(e){}

return text
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

return[];

}


function getSizes(product){
return getList(product?.sizes);
}


function getColors(product){

if(!product)return[];

if(
product.colors!==null &&
product.colors!==undefined
){

const colors=
getList(product.colors);

if(colors.length)return colors;

}

return getList(product.color);

}


function salePrice(product){

const normal=
Number(product?.price||0);

const sale=
Number(product?.sale_price||0);

if(
sale>0 &&
sale<normal
){

return sale;

}

return normal;

}


function discount(product){

const normal=
Number(product?.price||0);

const sale=
Number(product?.sale_price||0);

if(
normal>0 &&
sale>0 &&
sale<normal
){

return Math.round(
((normal-sale)/normal)*100
);

}

return 0;

}


function stars(value){

const rating=
Math.max(0,Math.min(5,Number(value||0)));

return "★".repeat(rating)+
"☆".repeat(5-rating);

function addToCart(
product,
qty,
size="",
color=""

Number(product.stock||0);

const existing=
cart.find(item=>
String(item.product_id)===
String(product.id)&&
String(item.size||"")===
String(size||"")&&
String(item.color||"")===
String(color||"")
);

if(existing){

existing.qty=
Math.min(
stock,
Number(existing.qty||1)+Number(qty||1)
);

}else{

cart.push({

cart_id:
crypto.randomUUID(),

product_id:
product.id,

name:
product.name,

price:
salePrice(product),

image_url:
getImages(product)[0]||"",

stock:stock,

qty:Number(qty||1),

size:size||"",

color:color||""

});

saveCart();

}

0
);

function subtotal(){

return cart.reduce(
(sum,item)=>
sum+
Number(item.price||0)*
Number(item.qty||1),
0
);

}


function couponDiscount(){

if(!appliedCoupon)return 0;

const sub=
subtotal();

const type=
String(
appliedCoupon.discount_type||""
)
.toLowerCase()
.trim();

const value=
Number(
appliedCoupon.discount_value||0
);

if(
type==="percent"||
type==="percentage"
){

return Math.min(
sub,
sub*value/100
);

}

if(type==="fixed"){

return Math.min(
sub,
value
);

}

return 0;

}


function total(){

return Math.max(
0,
subtotal()-couponDiscount()
);

}

COUPON
===================================== */

async function applyCoupon(){

const input=
document.getElementById(
"couponInput"
);

const msg=
document.getElementById(
"couponMsg"
);

if(!input||!msg)return;

const code=
input.value.trim().toUpperCase();

if(!code){

appliedCoupon=null;

msg.className=
"notice err";

msg.textContent=
t("couponBad");

refreshTotals();

return;

}

try{

const response=
await fetch(
SUPABASE_URL+
"/rest/v1/coupons"+
"?code=eq."+
encodeURIComponent(code)+
"&active=eq.true"+
"&select=*",
{
headers:HEADERS
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const data=
await response.json();

if(!data.length){

throw new Error("INVALID");

}

const coupon=
data[0];

if(coupon.expires_at){

const expiry=
new Date(coupon.expires_at);

if(
isNaN(expiry.getTime())||
expiry<=new Date()
){

throw new Error("EXPIRED");

}

}

if(
coupon.max_uses!==null&&
coupon.max_uses!==undefined&&
Number(coupon.max_uses)>0&&
Number(coupon.used_count||0)>=
Number(coupon.max_uses)
){

throw new Error("MAX");

}

if(
subtotal()<
Number(coupon.min_order||0)
){

throw new Error("MIN");

}

const type=
String(
coupon.discount_type||""
)
.toLowerCase()
.trim();

const value=
Number(
coupon.discount_value||0
);

if(
value<=0||
(
type!=="percent"&&
type!=="percentage"&&
type!=="fixed"
)
){

throw new Error("INVALID");

}

appliedCoupon={

...coupon,

discount_type:
type==="percentage"
?
"percent"
:
type

};

msg.className=
"notice ok";

msg.textContent=
t("couponOK");

refreshTotals();

}catch(error){

console.error(
"COUPON ERROR:",
error
);

appliedCoupon=null;

msg.className=
"notice err";

msg.textContent=
t("couponBad");

refreshTotals();

}

}

async function placeOrder(){

const msg=
document.getElementById(
"orderMsg"
);

if(!msg)return;

if(!cart.length){

msg.className=
"notice err";

msg.textContent=
t("empty");

return;

}

const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const whatsapp=
document.getElementById("whatsapp").value.trim();

const city=
document.getElementById("city").value.trim();

const address=
document.getElementById("address").value.trim();

if(
!name||
!phone||
!whatsapp||
!city||
!address
){

msg.className=
"notice err";

msg.textContent=
t("required");

return;

}

msg.className=
"notice";

msg.textContent=
language==="ar"
?
"جاري تسجيل الطلب..."
:
"Placing order...";

const order={

customer_name:name,

phone:phone,

whatsapp:whatsapp,

address:address,

city:city,

payment_method:"cod",

payment_status:"pending",

status:"new",

total:total(),

items:
cart.map(item=>({

product_id:
item.product_id,

name:
item.name,

price:
Number(item.price||0),

qty:
Number(item.qty||1),

size:
item.size||"",

color:
item.color||""

})),

coupon_code:
appliedCoupon
?
appliedCoupon.code
:
null,

discount:
couponDiscount()

};

try{

const response=
await fetch(
SUPABASE_URL+
"/rest/v1/orders",
{

method:"POST",

headers:{
...HEADERS,
Prefer:"return=representation"
},

body:
JSON.stringify(order)

}
);

if(!response.ok){

const errorText=
await response.text();

console.error(
"ORDER ERROR:",
errorText
);

throw new Error(errorText);

}

const result=
await response.json();

let orderNumber="";

if(
Array.isArray(result)&&
result[0]&&
result[0].order_number
){

orderNumber=
result[0].order_number;

}


/* UPDATE COUPON */

if(appliedCoupon){

try{

await fetch(
SUPABASE_URL+
"/rest/v1/coupons?id=eq."+
encodeURIComponent(
appliedCoupon.id
),
{

method:"PATCH",

headers:HEADERS,

body:
JSON.stringify({

used_count:
Number(
appliedCoupon.used_count||0
)+1

})

}
);

}catch(e){

console.warn(
"Coupon count update failed",
e
);

}

}


/* SUCCESS */

msg.className=
"notice ok";

msg.textContent=
orderNumber
?
t("success")+
" رقم الطلب: "+
orderNumber
:
t("success");

cart=[];

appliedCoupon=null;

localStorage.removeItem(
"vanta_cart"
);

updateCount();

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("whatsapp").value="";
document.getElementById("city").value="";
document.getElementById("address").value="";

const couponInput=
document.getElementById("couponInput");

if(couponInput){
couponInput.value="";
}

renderCartItems();
refreshTotals();

}catch(error){

console.error(
"ORDER ERROR:",
error
);

msg.className=
"notice err";

msg.textContent=
t("error");

}

}

placeholder="${t("reviewName")}">

<div>
${t("chooseRating")}
</div>

<div class="ratingButtons">

${[1,2,3,4,5].map(n=>`

<button
class="starBtn ${n===5?"selected":""}"
onclick="selectRating(${n})"
id="rating-${n}">

${n} ⭐

</button>

`).join("")}

</div>

<textarea
id="reviewComment"
rows="4"
placeholder="${t("reviewComment")}"></textarea>

<button
class="reviewSubmit"
onclick="submitReview()">

${t("sendReview")}

</button>

<div id="reviewMsg"></div>

</div>


<div
class="reviewList"
id="reviewList">

${t("loading")}

</div>

`;

}


function selectRating(value){

selectedRating=value;

document
.querySelectorAll(".starBtn")
.forEach(btn=>{

const n=
Number(
btn.id.replace("rating-","")
);

btn.classList.toggle(
"selected",
n===value
);

});

}


async function loadReviews(){

const area=
document.getElementById("reviewArea");

if(!area||!selectedProduct)return;

area.innerHTML=
reviewHTML();

try{

const response=
await fetch(
SUPABASE_URL+
"/rest/v1/reviews"+
"?product_id=eq."+
encodeURIComponent(selectedProduct.id)+
"&active=eq.true"+
"&select=*"+
"&order=created_at.desc",
{
headers:HEADERS
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const reviews=
await response.json();

renderReviews(reviews);

}catch(error){

console.error(
"REVIEWS ERROR:",
error
);

const list=
document.getElementById("reviewList");

if(list){

list.innerHTML=
`<div class="notice err">
${t("reviewError")}
</div>`;

}

}

}


function renderReviews(reviews){

const average=
reviews.length
?
reviews.reduce(
(sum,r)=>
sum+Number(r.rating||0),
0
)/reviews.length
:
0;

const avg=
Math.round(average*10)/10;

const avgEl=
document.getElementById(
"reviewAverage"
);

const starsEl=
document.getElementById(
"reviewStars"
);

const countEl=
document.getElementById(
"reviewCount"
);

const list=
document.getElementById(
"reviewList"
);

if(avgEl){

avgEl.textContent=
avg.toFixed(1)+
" / 5";

}

if(starsEl){

starsEl.textContent=
stars(Math.round(avg));

}

if(countEl){

countEl.textContent=
reviews.length+
" "+
(
language==="ar"
?
"تقييم"
:
"reviews"
);

}

if(!list)return;

if(!reviews.length){

list.innerHTML=
`<div class="empty">
${t("noReviews")}
</div>`;

return;

}

list.innerHTML=
reviews.map(review=>`

<div class="review">

<div class="reviewHead">

<div>

<b>
${esc(review.customer_name)}
</b>

<br>

<span class="stars">
${stars(Number(review.rating))}
</span>

</div>

<div class="reviewDate">
${formatDate(review.created_at)}
</div>

</div>

<div class="reviewText">
${esc(review.comment)}
</div>

</div>

`).join("");

}


function formatDate(value){

if(!value)return"";

const date=
new Date(value);

if(isNaN(date.getTime()))return"";

return date.toLocaleDateString(
language==="ar"
?
"ar-EG"
:
"en-US"
);

}


async function submitReview(){

if(!selectedProduct)return;

const nameEl=
document.getElementById(
"reviewName"
);

const commentEl=
document.getElementById(
"reviewComment"
);

const msg=
document.getElementById(
"reviewMsg"
);

const name=
nameEl
?
nameEl.value.trim()
:
"";

const comment=
commentEl
?
commentEl.value.trim()
:
"";

if(!name||!comment){

if(msg){

msg.className=
"notice err";

msg.textContent=
language==="ar"
?
"اكتب الاسم والتعليق أولًا"
:
"Please enter your name and comment.";

}

return;

}

try{

const response=
await fetch(
SUPABASE_URL+
"/rest/v1/reviews",
{

method:"POST",

headers:{
...HEADERS,
Prefer:"return=minimal"
},

body:
JSON.stringify({

product_id:
selectedProduct.id,

customer_name:name,

rating:selectedRating,

comment:comment,

active:true

})

}
);

if(!response.ok){

const errorText=
await response.text();

console.error(
"REVIEW INSERT ERROR:",
errorText
);

throw new Error(errorText);

}

if(msg){

msg.className=
"notice ok";

msg.textContent=
t("reviewSuccess");

}

nameEl.value="";
commentEl.value="";

selectedRating=5;

selectRating(5);

loadReviews();

}catch(error){

console.error(
"REVIEW ERROR:",
error
);

if(msg){

msg.className=
"notice err";

msg.textContent=
t("reviewError");

}

}

}

NAVIGATION
===================================== */

function goHome(){

history.replaceState(
null,
"",
location.pathname+
location.search
);

activeCategory="";

render();

window.scrollTo(0,0);

}


function goShop(){

history.replaceState(
null,
"",
location.pathname+
location.search
);

activeCategory="";

render();

setTimeout(()=>{

const shop=
document.getElementById("shop");

if(shop){

shop.scrollIntoView({
behavior:"smooth"
});

}

},100);

}


/* =====================================
MAIN RENDER
===================================== */

function render(){

applyLanguage();

const hash=
location.hash;


/* CART */

if(hash==="#cart"){

document.getElementById(
"app"
).innerHTML=
cartHTML();

renderCartItems();

refreshTotals();

return;

}


/* OFFERS */

if(hash==="#offers"){

document.getElementById(
"app"
).innerHTML=
offersHTML();

renderOffers();

return;

}


/* PRODUCT */

if(
hash.startsWith("#product?")
){

const query=
hash.split("?")[1];

const params=
new URLSearchParams(query);

const id=
params.get("id");

const product=
products.find(
p=>String(p.id)===
String(id)
);

if(product){

document.getElementById(
"app"
).innerHTML=
productHTML(product);

renderRecommended();

loadReviews();

return;

}

}


/* HOME */

document.getElementById(
"app"
).innerHTML=
homeHTML();

renderProducts();

}


/* =====================================
BACK / FORWARD
===================================== */

window.addEventListener(
"popstate",
function(){

render();

window.scrollTo(0,0);

});


window.addEventListener(
"hashchange",
function(){

render();

window.scrollTo(0,0);

});


/* =====================================
START
===================================== */

updateCount();

loadProducts();

</script>
