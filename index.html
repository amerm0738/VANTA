/* =========================================
   HELPERS
========================================= */

function esc(value){

return String(value??"")
.replace(/[&<>"']/g,function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];

});

}


function money(value){

return "EGP "+
Number(value||0).toLocaleString();

}


function getImages(product){

if(!product)return[];

let arr=[];

if(Array.isArray(product.image_urls)){

arr=product.image_urls;

}

else if(
typeof product.image_urls==="string"
){

const value=
product.image_urls.trim();

if(value){

try{

const parsed=
JSON.parse(value);

if(Array.isArray(parsed)){
arr=parsed;
}

}catch(e){

arr=value
.split(",")
.map(x=>x.trim());

}

}

}

if(
!arr.length &&
product.image_url
){

arr=[product.image_url];

}

return arr.filter(Boolean);

}


function getSizes(product){

if(!product)return[];

const value=product.sizes;

if(Array.isArray(value)){

return value
.map(x=>String(x).trim())
.filter(Boolean);

}

if(typeof value==="string"){

const text=value.trim();

if(!text)return[];

try{

const parsed=
JSON.parse(text);

if(Array.isArray(parsed)){

return parsed
.map(x=>String(x).trim())
.filter(Boolean);

}

}catch(e){}

return text
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

return[];

}


function getColors(product){

if(!product)return[];

if(product.colors){

if(Array.isArray(product.colors)){

return product.colors;

}

if(typeof product.colors==="string"){

try{

const parsed=
JSON.parse(product.colors);

if(Array.isArray(parsed)){
return parsed;
}

}catch(e){}

return product.colors
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

}

if(product.color){

return String(product.color)
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

return[];

}


function salePrice(product){

const normal=
Number(product.price||0);

const sale=
Number(product.sale_price||0);

if(
sale>0 &&
sale<normal
){

return sale;

}

return normal;

}


function discount(product){

const normal=
Number(product.price||0);

const sale=
Number(product.sale_price||0);

if(
normal>0 &&
sale>0 &&
sale<normal
){

return Math.round(
((normal-sale)/normal)*100
);

}

return 0;

}

function subtotal(){

return cart.reduce(
(sum,item)=>
sum+
Number(item.price||0)*
Number(item.qty||1),
0
);

}


function couponDiscount(){

if(!appliedCoupon)return 0;

const sub=
subtotal();

const type=
String(
appliedCoupon.discount_type||""
)
.toLowerCase()
.trim();

const value=
Number(
appliedCoupon.discount_value||0
);

if(
type==="percent"||
type==="percentage"
){

return Math.min(
sub,
sub*value/100
);

}

if(type==="fixed"){

return Math.min(
sub,
value
);

}

return 0;

}


function total(){

return Math.max(
0,
subtotal()-couponDiscount()
);

}

async function applyCoupon(){

const input=
document.getElementById(
"couponInput"
);

const msg=
document.getElementById(
"couponMsg"
);

if(!input||!msg)return;

const code=
input.value.trim().toUpperCase();

if(!code){

appliedCoupon=null;

msg.className=
"notice err";

msg.textContent=
t("couponBad");

refreshTotals();

return;

}

try{

const response=
await fetch(
SUPABASE_URL+
"/rest/v1/coupons"+
"?code=eq."+
encodeURIComponent(code)+
"&active=eq.true"+
"&select=*",
{
headers:HEADERS
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const data=
await response.json();

if(!data.length){

throw new Error(
"INVALID"
);

}

const coupon=data[0];

if(coupon.expires_at){

const expiry=
new Date(
coupon.expires_at
);

if(
isNaN(expiry.getTime())||
expiry<=new Date()
){

throw new Error(
"EXPIRED"
);

}

}

if(
coupon.max_uses!==null&&
coupon.max_uses!==undefined&&
Number(coupon.max_uses)>0&&
Number(coupon.used_count||0)>=
Number(coupon.max_uses)
){

throw new Error(
"MAX"
);

}

if(
subtotal()<
Number(coupon.min_order||0)
){

throw new Error(
"MIN"
);

}

const type=
String(
coupon.discount_type||""
)
.toLowerCase()
.trim();

const value=
Number(
coupon.discount_value||0
);

if(
value<=0||
(
type!=="percent"&&
type!=="percentage"&&
type!=="fixed"
)
){

throw new Error(
"INVALID"
);

}

appliedCoupon={
...coupon,
discount_type:
type==="percentage"
?
"percent"
:
type
};

msg.className=
"notice ok";

msg.textContent=
t("couponOK");

refreshTotals();

}catch(error){

console.error(
"COUPON ERROR:",
error
);

appliedCoupon=null;

msg.className=
"notice err";

msg.textContent=
t("couponBad");

refreshTotals();

}

}
