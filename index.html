/* =========================================
   LANGUAGE
========================================= */

function setupLanguage(){

document.documentElement.lang=language;

document.documentElement.dir=
language==="ar"?"rtl":"ltr";

document.getElementById("langBtn").textContent=
language==="ar"?"EN":"AR";

language=

localStorage.setItem(

);

/* =========================================
   HELPERS
========================================= */

function esc(v){

return String(v??"")
.replace(/[&<>"']/g,function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];

});

}


function images(product){

let arr=[];

if(Array.isArray(product.image_urls)){
arr=product.image_urls.filter(Boolean);
}

else if(typeof product.image_urls==="string"){

try{

const x=JSON.parse(product.image_urls);

if(Array.isArray(x)){
arr=x.filter(Boolean);
}

}catch(e){

arr=product.image_urls
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

}

if(!arr.length && product.image_url){
arr=[product.image_url];
}

return arr;
}


function sizes(product){

if(Array.isArray(product.sizes)){
return product.sizes;
}

if(typeof product.sizes==="string"){

try{

const x=JSON.parse(product.sizes);

if(Array.isArray(x)){
return x;
}

}catch(e){}

return product.sizes
.split(",")
.map(x=>x.trim())
.filter(Boolean);

}

return [];
}


function colors(product){

let result=[];

if(product.colors){

if(Array.isArray(product.colors)){
result=product.colors;
}

else if(typeof product.colors==="string"){

try{

const x=JSON.parse(product.colors);

if(Array.isArray(x)){
result=x;
}

else{
result=product.colors
.split(",")
.map(x=>x.trim());
}

}catch(e){

result=product.colors
.split(",")
.map(x=>x.trim());

}

}

}

if(!result.length && product.color){
result=[product.color];
}

return result.filter(Boolean);
}


function salePrice(product){

const normal=
Number(product.price||0);

const sale=
Number(product.sale_price||0);

return sale>0&&sale<normal
?sale
:normal;

}


function discount(product){

const normal=
Number(product.price||0);

const sale=
Number(product.sale_price||0);

if(
normal>0 &&
sale>0 &&
sale<normal
){

return Math.round(
((normal-sale)/normal)*100
);

}

return 0;
}


function money(n){

return "EGP "+
Number(n||0).toLocaleString();

}

/* =========================================
   PRODUCTS
========================================= */

async function loadProducts(){

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/products?select=*",
{
headers:HEADERS
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

products=await response.json();

render();

}catch(error){

console.error(
"PRODUCT ERROR:",
error
);

document.getElementById("app").innerHTML=`

<section>

<div class="notice err">
تعذر تحميل المنتجات من Supabase.
</div>

</section>

`;

}

}


function renderProducts(){

const box=
document.getElementById("products");

if(!box)return;

const input=
document.getElementById("search");

const q=input
?
input.value.trim().toLowerCase()
:
"";

let list=
products.filter(
p=>p.active!==false
);

if(q){

list=list.filter(
p=>
String(p.name||"")
.toLowerCase()
.includes(q)
);

}

if(category){

list=list.filter(
p=>
String(p.category||"")
.toLowerCase()===
category.toLowerCase()
);

}

if(!list.length){

box.innerHTML=
`<div class="empty">
لا توجد منتجات.
</div>`;

return;

}

box.innerHTML=
list.map(p=>{

const index=
products.indexOf(p);

const imgs=
images(p);

const d=
discount(p);

const stock=
Number(p.stock||0);

return `

<article
class="card"
onclick="openProduct('${p.id}')">

<div class="pic">

${
imgs[0]
?
`<img
src="${esc(imgs[0])}"
alt="${esc(p.name)}">`
:
"V"
}

${
d
?
`<span class="badge">
-${d}%
</span>`
:
""
}

</div>

<div class="info">

<h3>
${esc(p.name||"")}
</h3>

<div>
${esc(p.color||"")}
</div>

<div class="price">

${
d
?
`<span class="oldPrice">
${money(p.price)}
</span>`
:
""
}

${money(salePrice(p))}

</div>

${
d
?
`<div class="salePercent">
🔥 ${t("sale")} ${d}%
</div>`
:
""
}

<div class="stock">

${
stock>0
?
t("available")+" : "+stock
:
t("out")
}

</div>

<button
class="add"
${stock<1?"disabled":""}
onclick="
event.stopPropagation();
quickAdd(${index})
">

${stock<1?t("out"):t("add")}

</button>

</div>

</article>

`;

}).join("");

}

========================================= */

function quickAdd(index){

const p=products[index];

if(!p)return;

if(Number(p.stock||0)<1)return;

const existing=cart.find(
x=>
String(x.product_id)===
String(p.id)&&
(x.size||"")===""&&
(x.color||"")===""
);

if(existing){

existing.qty=Math.min(
Number(p.stock),
Number(existing.qty||1)+1
);

}else{

cart.push({

id:crypto.randomUUID(),

product_id:p.id,

name:p.name,

price:salePrice(p),

image_url:images(p)[0]||"",

stock:Number(p.stock||0),

qty:1,

size:"",

color:""

});

}

saveLocalCart();

openCartPage();

}

function saveLocalCart(){

localStorage.setItem(
"vanta_cart",
JSON.stringify(cart)
);

updateCount();

}


function updateCount(){

const count=
document.getElementById("count");

if(count){

count.textContent=
cart.reduce(
(s,x)=>
s+Number(x.qty||1),
0
);

}

}


function cartSubtotal(){

return cart.reduce(
(s,x)=>
s+
Number(x.price||0)*
Number(x.qty||1),
0
);

}


function discountAmount(){

if(!appliedCoupon)return 0;

const sub=
cartSubtotal();

const value=
Number(
appliedCoupon.discount_value||0
);

const type=
String(
appliedCoupon.discount_type||""
).toLowerCase();

if(
type==="percent"||
type==="percentage"
){

return Math.min(
sub,
sub*value/100
);

}

if(type==="fixed"){

return Math.min(
sub,
value
);

}

return 0;

}


function cartTotal(){

return Math.max(
0,
cartSubtotal()-
discountAmount()
);

}

function changeCartQty(index,n){

const item=cart[index];

if(!item)return;

const max=
Number(item.stock||999999);

item.qty=Math.max(
1,
Math.min(
max,
Number(item.qty||1)+n
)
);

saveLocalCart();

renderCartItems();

refreshCartTotals();

}


function removeCartItem(index){

cart.splice(index,1);

saveLocalCart();

/* =========================================
   COUPONS
========================================= */

async function applyCoupon(){

const input=
document.getElementById(
"couponInput"
);

const msg=
document.getElementById(
"couponMsg"
);

if(!input||!msg)return;

const code=
input.value.trim().toUpperCase();

if(!code){

appliedCoupon=null;

msg.className=
"notice err";

msg.textContent=
t("couponBad");

refreshCartTotals();

return;

}

try{

const url=
SUPABASE_URL+
"/rest/v1/coupons"+
"?code=eq."+
encodeURIComponent(code)+
"&active=eq.true"+
"&select=*";

const response=
await fetch(
url,
{
method:"GET",
headers:HEADERS
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const data=
await response.json();

if(!data.length){

throw new Error(
"INVALID_COUPON"
);

}

const coupon=data[0];

if(coupon.expires_at){

const expiry=
new Date(
coupon.expires_at
);

if(
isNaN(expiry.getTime())||
expiry<=new Date()
){

throw new Error(
"EXPIRED"
);

}

}

if(
coupon.max_uses!==null&&
coupon.max_uses!==undefined&&
Number(coupon.max_uses)>0&&
Number(coupon.used_count||0)>=
Number(coupon.max_uses)
){

throw new Error(
"MAX_USES"
);

}

const minimum=
Number(
coupon.min_order||0
);

if(
cartSubtotal()<minimum
){

throw new Error(
"MIN_ORDER"
);

}

const type=
String(
coupon.discount_type||""
)
.toLowerCase()
.trim();

const value=
Number(
coupon.discount_value||0
);

if(value<=0){

throw new Error(
"INVALID_VALUE"
);

}

if(
type!=="percent"&&
type!=="percentage"&&
type!=="fixed"
){

throw new Error(
"INVALID_TYPE"
);

}

appliedCoupon={
...coupon,
discount_type:
type==="percentage"
?
"percent"
:
type
};

msg.className=
"notice ok";

msg.textContent=
t("couponOK");

refreshCartTotals();

}catch(error){

console.error(
"COUPON ERROR:",
error
);

appliedCoupon=null;

msg.className=
"notice err";

msg.textContent=
t("couponBad");

refreshCartTotals();

}

}

async function placeOrder(){

const msg=
document.getElementById(
"orderMsg"
);

if(!msg)return;

if(!cart.length){

msg.className=
"notice err";

msg.textContent=
t("empty");

return;

}

const name=
document.getElementById(
"name"
).value.trim();

const phone=
document.getElementById(
"phone"
).value.trim();

const whatsapp=
document.getElementById(
"whatsapp"
).value.trim();

const city=
document.getElementById(
"city"
).value.trim();

const address=
document.getElementById(
"address"
).value.trim();

if(
!name||
!phone||
!whatsapp||
!city||
!address
){

msg.className=
"notice err";

msg.textContent=
t("required");

return;

}

msg.className=
"notice";

msg.textContent=
language==="ar"
?
"جاري تسجيل الطلب..."
:
"Placing order...";


const order={

customer_name:name,

phone:phone,

whatsapp:whatsapp,

address:address,

city:city,

payment_method:"cod",

payment_status:"pending",

status:"pending",

total:cartTotal(),

items:cart.map(
item=>({

product_id:item.product_id,

name:item.name,

price:Number(
item.price||0
),

qty:Number(
item.qty||1
),

size:item.size||"",

color:item.color||""

})
),

coupon_code:
appliedCoupon
?
appliedCoupon.code
:
null,

discount:
discountAmount()

};


try{

const response=
await fetch(
SUPABASE_URL+
"/rest/v1/orders",
{

method:"POST",

headers:{
...HEADERS,
Prefer:
"return=representation"
},

body:
JSON.stringify(order)

}
);

if(!response.ok){

const errorText=
await response.text();

console.error(
"ORDER ERROR:",
errorText
);

throw new Error(
errorText
);

}

const result=
await response.json();

console.log(
"ORDER CREATED:",
result
);


/* تحديث استعمال الكوبون */

if(appliedCoupon){

try{

await fetch(
SUPABASE_URL+
"/rest/v1/coupons?id=eq."+
encodeURIComponent(
appliedCoupon.id
),
{

method:"PATCH",

headers:HEADERS,

body:
JSON.stringify({

used_count:
Number(
appliedCoupon.used_count||0
)+1

})

}

);

}catch(e){

console.warn(
"Coupon usage update failed:",
e
);

}

}


msg.className=
"notice ok";

msg.textContent=
t("success");


/*
السلة تتمسح فقط
بعد نجاح الطلب
*/

cart=[];

appliedCoupon=null;

localStorage.removeItem(
"vanta_cart"
);

updateCount();


document.getElementById(
"name"
).value="";

document.getElementById(
"phone"
).value="";

document.getElementById(
"whatsapp"
).value="";

document.getElementById(
"city"
).value="";

document.getElementById(
"address"
).value="";

const couponInput=
document.getElementById(
"couponInput"
);

if(couponInput){
couponInput.value="";
}

renderCartItems();

refreshCartTotals();


}catch(error){

console.error(
"ORDER ERROR:",
error
);

msg.className=
"notice err";

msg.textContent=
t("error");

/*
مهم:
السلة لا تتمسح لو الطلب فشل
*/

}

}

location.hash;


if(hash==="#cart"){

document.getElementById(
"app"
).innerHTML=
cartHTML();

renderCartItems();

refreshCartTotals();

return;

}


if(hash==="#offers"){

document.getElementById(
"app"
).innerHTML=
homeHTML();

showOffers();

return;

}


if(hash.startsWith(
"#product?"
)){

const query=
hash.split("?")[1];

const params=
new URLSearchParams(query);

const id=
params.get("id");

const p=
products.find(
x=>String(x.id)===
String(id)
);

if(p){

document.getElementById(
"app"
).innerHTML=
productHTML(p);

renderRecommended();

return;

}

}


document.getElementById(
"app"
).innerHTML=
homeHTML();

renderProducts();

}
