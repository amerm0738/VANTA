function renderLogin(msg=''){document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('app').innerHTML=`<main class="login"><div class="loginBox"><div class="logo">VANTA</div><div class="eyebrow">CONTROL CENTER</div><div class="field"><label>${t('user')}</label><input id="loginUser" autocomplete="off"></div><div class="field"><label>${t('pass')}</label><input id="loginPass" type="password" autocomplete="off"></div><button class="btn primary wide" onclick="login()">${t('enter')}</button>${msg?`<div class="notice err">${esc(msg)}</div>`:''}</div></main>`}

function shell(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';return `<div class="shell"><aside class="side"><div class="brand"><b>VANTA</b><small>CONTROL CENTER</small></div><nav class="nav">${[['dashboard','▦'],['sales','◈'],['orders','▤'],['products','□'],['inventory','◫'],['offers','%'],['shipping','🚚'],['custom','✦'],['settings','⚙']].map(([x,i])=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';loadTab()">${i} &nbsp; ${t(x)}</button>`).join('')}</nav><div class="sideBottom"><button class="btn wide" onclick="lang=lang==='ar'?'en':'ar';localStorage.setItem('vanta_admin_lang',lang);loadTab()">${lang==='ar'?'EN':'AR'}</button><button class="btn danger wide" style="margin-top:8px" onclick="logout()">${t('logout')}</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow" style="text-align:${lang==='ar'?'right':'left'};margin:0">VANTA / ADMIN</div><h1 class="title">${t(tab)}</h1></div><div class="actions"><button class="btn" onclick="loadTab()">↻</button><button class="btn" onclick="location.href='index.html'">${lang==='ar'?'المتجر':'Store'}</button></div></div><div id="content"></div></main></div>`}

async function loadTab(){document.getElementById('app').innerHTML=shell();try{if(tab==='dashboard')return dashboard();if(tab==='sales')return sales();if(tab==='orders')return ordersView();if(tab==='products')return productsView();if(tab==='inventory')return inventoryView();if(tab==='offers')return offersView();if(tab==='shipping')return shippingView();if(tab==='custom')return customView();if(tab==='settings')return settingsView()}catch(e){document.getElementById('content').innerHTML=`<div class="notice err">${esc(e.message)}</div>`}}

async function dashboard(){await loadAll();const active=products.filter(p=>p.active!==false).length,stock=products.reduce((s,p)=>s+Number(p.stock||0),0),valid=orders.filter(o=>o.status!=='cancelled'),revenue=valid.reduce((s,o)=>s+Number(o.total||0),0),unread=notifications.filter(n=>!n.read).length;document.getElementById('content').innerHTML=`<div class="cards"><div class="stat"><small>${t('productsCount')}</small><strong>${products.length}</strong></div><div class="stat"><small>${t('active')}</small><strong>${active}</strong></div><div class="stat"><small>${t('stock')}</small><strong>${stock}</strong></div><div class="stat"><small>${t('ordersCount')}</small><strong>${orders.length}</strong></div><div class="stat"><small>${t('revenue')}</small><strong>${money(revenue)}</strong></div></div><div class="grid2" style="margin-top:16px"><div class="panel"><div class="row"><h2>🔔 ${t('newOrder')}</h2><span class="pill ${unread?'red':'green'}">${unread}</span></div><div class="actions"><button class="btn primary" onclick="tab='orders';loadTab()">${t('orders')}</button><button class="btn" onclick="tab='sales';loadTab()">${t('sales')}</button></div></div><div class="panel"><h2>${t('top')}</h2>${topProducts().map((x,i)=>`<div class="chartRow"><span>${esc(x.name)}</span><div class="bar"><i style="width:${x.pct}%"></i></div><b>${x.units}</b></div>`).join('')||`<div class="empty">${t('noData')}</div>`}</div></div>`}
function parseItems(o){let a=o?.items;try{if(typeof a==='string')a=JSON.parse(a)}catch{}return Array.isArray(a)?a:[]}
function topProducts(){const m={};for(const o of orders.filter(x=>x.status!=='cancelled'))for(const i of parseItems(o)){const k=i.product_id||i.name||'x';m[k]=m[k]||{name:i.name_ar||i.name_en||i.name||'Product',units:0};m[k].units+=Number(i.qty||1)}const a=Object.values(m).sort((x,y)=>y.units-x.units).slice(0,8),mx=a[0]?.units||1;return a.map(x=>({...x,pct:Math.max(4,Math.round(x.units/mx*100))}))}
async function sales(){await loadAll();const good=orders.filter(o=>o.status!=='cancelled'),cancel=orders.filter(o=>o.status==='cancelled'),rev=good.reduce((s,o)=>s+Number(o.total||0),0),units=good.reduce((s,o)=>s+parseItems(o).reduce((a,i)=>a+Number(i.qty||0),0),0);document.getElementById('content').innerHTML=`<div class="cards"><div class="stat"><small>${t('revenueNet')}</small><strong>${money(rev)}</strong></div><div class="stat"><small>${t('cancelledRevenue')}</small><strong>${money(cancel.reduce((s,o)=>s+Number(o.total||0),0))}</strong></div><div class="stat"><small>${t('units')}</small><strong>${units}</strong></div><div class="stat"><small>${t('average')}</small><strong>${money(good.length?rev/good.length:0)}</strong></div><div class="stat"><small>${t('ordersCount')}</small><strong>${good.length}</strong></div></div><div class="panel" style="margin-top:16px"><h2>${t('best')}</h2>${topProducts().map((x,i)=>`<div class="chartRow"><span>${esc(x.name)}</span><div class="bar"><i style="width:${x.pct}%"></i></div><b>${x.units}</b></div>`).join('')||`<div class="empty">${t('noData')}</div>`}</div>`}
async function productsView(){await loadAll();document.getElementById('content').innerHTML=`<div class="panel"><div class="row"><h2>${t('products')}</h2><button class="btn gold" onclick="productEditor()">＋ ${t('add')}</button></div><div class="tableWrap"><table class="table"><thead><tr><th>${t('image')}</th><th>${t('nameAr')}</th><th>${t('nameEn')}</th><th>${t('price')}</th><th>${t('stock')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:''}</td><td>${esc(p.name_ar||p.name||'')}</td><td>${esc(p.name_en||'')}</td><td>${money(p.sale_price>0&&p.sale_price<p.price?p.sale_price:p.price)}</td><td>${totalStock(p)}</td><td><span class="pill ${p.active!==false?'green':'red'}">${p.active!==false?t('active'):'Hidden'}</span></td><td><button class="btn" onclick="productEditor('${esc(p.id)}')">${t('edit')}</button> <button class="btn danger" onclick="deleteProduct('${esc(p.id)}')">${t('delete')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">${t('noData')}</td></tr>`}</tbody></table></div></div>`}
function list(v){if(Array.isArray(v))return v;try{const x=JSON.parse(v);if(Array.isArray(x))return x}catch{}return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}function totalStock(p){const vs=variants.filter(v=>String(v.product_id)===String(p.id));return vs.length?vs.reduce((s,v)=>s+Number(v.stock||0),0):Number(p.stock||0)}
function productEditor(id=''){const p=products.find(x=>String(x.id)===String(id))||{};document.getElementById('content').innerHTML=`<div class="panel"><div class="row"><h2>${id?t('edit'):t('add')} ${t('products')}</h2><button class="btn" onclick="productsView()">${t('products')}</button></div><div class="grid2"><div class="field"><label>${t('nameAr')}</label><input id="p_ar" value="${esc(p.name_ar||p.name||'')}"></div><div class="field"><label>${t('nameEn')}</label><input id="p_en" value="${esc(p.name_en||'')}"></div><div class="field"><label>${t('descAr')}</label><textarea id="d_ar" rows="4">${esc(p.description_ar||'')}</textarea></div><div class="field"><label>${t('descEn')}</label><textarea id="d_en" rows="4">${esc(p.description_en||'')}</textarea></div><div class="field"><label>${t('price')}</label><input id="price" type="number" value="${Number(p.price||0)}"></div><div class="field"><label>${t('sale')}</label><input id="sale" type="number" value="${Number(p.sale_price||0)}"></div><div class="field"><label>${t('stockBase')}</label><input id="stock" type="number" value="${Number(p.stock||0)}"></div><div class="field"><label>${t('category')}</label><input id="cat" value="${esc(p.category||'')}"></div><div class="field"><label>${t('sizes')}</label><input id="sizes" value="${esc(list(p.sizes).join(', '))}" placeholder="S, M, L, XL"></div><div class="field"><label>${t('colors')}</label><input id="colors" value="${esc(list(p.colors).join(', '))}" placeholder="Black, White"></div><div class="field"><label>Slug</label><input id="slug" value="${esc(p.slug||'')}"></div><div class="field"><label>${t('status')}</label><select id="active"><option value="true" ${p.active!==false?'selected':''}>${t('active')}</option><option value="false" ${p.active===false?'selected':''}>Hidden</option></select></div><div class="field"><label>${lang==='ar'?'الأكثر مبيعًا / مميز':'Best seller / Featured'}</label><select id="featured"><option value="false" ${!p.is_featured?'selected':''}>${lang==='ar'?'عادي':'Normal'}</option><option value="true" ${p.is_featured?'selected':''}>${lang==='ar'?'مميز':'Featured'}</option></select></div></div><div class="panel" style="margin-top:15px;background:#0a0a0a"><h3>${t('images')}</h3><input id="files" type="file" multiple accept="image/*" onchange="preview()"><div id="prev" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><div class="field"><label>Image URL</label><input id="imageUrl" placeholder="https://..."></div></div><div class="actions"><button class="btn gold" onclick="saveProduct('${esc(id)}')">${t('save')}</button><button class="btn" onclick="productsView()">${lang==='ar'?'إلغاء':'Cancel'}</button></div><div id="pm"></div></div>`}
function preview(){document.getElementById('prev').innerHTML=[...document.getElementById('files').files].map(f=>`<img class="thumb" src="${URL.createObjectURL(f)}">`).join('')}
async function uploadProductImages(){const out=[];for(const f of [...document.getElementById('files').files]){const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const j=await api('storage:upload',{filename:f.name,content_type:f.type||'image/jpeg',base64:b64});if(!j.url)throw Error('UPLOAD_FAILED');out.push(j.url)}const u=document.getElementById('imageUrl').value.trim();if(u)out.push(u);return out}
async function saveProduct(id){const m=document.getElementById('pm');try{const old=products.find(x=>String(x.id)===String(id))||{};const uploaded=await uploadProductImages();const imgs=[...list(old.image_urls),...uploaded].filter((x,i,a)=>x&&a.indexOf(x)===i);const p={name:document.getElementById('p_ar').value.trim()||document.getElementById('p_en').value.trim(),name_ar:document.getElementById('p_ar').value.trim(),name_en:document.getElementById('p_en').value.trim(),description_ar:document.getElementById('d_ar').value.trim(),description_en:document.getElementById('d_en').value.trim(),price:Number(document.getElementById('price').value||0),sale_price:Number(document.getElementById('sale').value||0),stock:Number(document.getElementById('stock').value||0),category:document.getElementById('cat').value.trim(),sizes:document.getElementById('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),colors:document.getElementById('colors').value.split(',').map(x=>x.trim()).filter(Boolean),slug:document.getElementById('slug').value.trim()||null,active:document.getElementById('active').value==='true',is_featured:document.getElementById('featured')?.value==='true',image_urls:imgs,image_url:imgs[0]||old.image_url||null};if(id)p.id=id;await api('products:save',{product:p});m.className='notice ok';m.textContent=t('saved');setTimeout(productsView,400)}catch(e){m.className='notice err';m.textContent=e.message}}
async function deleteProduct(id){if(!confirm(t('confirmDelete')))return;try{await api('products:delete',{id});await productsView()}catch(e){alert(e.message)}}
async function inventoryView(){await loadAll();document.getElementById('content').innerHTML=`<div class="panel"><div class="row"><h2>${t('inventory')}</h2></div><div class="tableWrap"><table class="table"><thead><tr><th>${t('products')}</th><th>${t('sizes')}</th><th>${t('colors')}</th><th>${t('stock')}</th><th>${t('add')}</th></tr></thead><tbody>${products.map(p=>{const vs=variants.filter(v=>String(v.product_id)===String(p.id));return `<tr><td><b>${esc(p.name_en||p.name||'')}</b><br>${esc(p.name_ar||'')}</td><td>${esc(list(p.sizes).join(', '))}</td><td>${esc(list(p.colors).join(', '))}</td><td>${vs.length?vs.map(v=>`${esc(v.size||'-')} / ${esc(v.color||'-')}: <b>${v.stock}</b> <button class="btn" onclick="editVariant('${v.id}',${v.stock})">${t('edit')}</button>`).join('<br>'):Number(p.stock||0)}</td><td><button class="btn gold" onclick="variantEditor('${p.id}')">＋</button></td></tr>`}).join('')}</tbody></table></div></div>`}
async function variantEditor(pid){const p=products.find(x=>String(x.id)===String(pid));const size=prompt(t('sizes')+' S/M/L/XL','M');if(size===null)return;const color=prompt(t('colors'),'Black');if(color===null)return;const stock=Number(prompt(t('stock'), '10'));await api('variants:save',{variant:{product_id:pid,size,color,stock:Math.max(0,stock)}});inventoryView()}

async function createManualOrder(){const m=document.getElementById('moMsg');try{const pid=document.getElementById('moProduct').value;const p=products.find(x=>String(x.id)===String(pid));const payload={p_customer_name:document.getElementById('moName').value.trim(),p_phone:document.getElementById('moPhone').value.trim(),p_whatsapp:document.getElementById('moWa').value.trim()||document.getElementById('moPhone').value.trim(),p_city:document.getElementById('moCity').value,p_address:document.getElementById('moAddress').value.trim(),p_items:[{product_id:pid,qty:Number(document.getElementById('moQty').value||1),size:'',color:''}],p_coupon_code:null};if(!p)throw Error('Product');await api('orders:create',{payload});m.className='notice ok';m.textContent=t('saved');setTimeout(ordersView,600)}catch(e){m.className='notice err';m.textContent=e.message}}

async function ordersView(){await loadAll();const q=window.orderSearch||'';const listO=orders.filter(o=>[o.order_number,o.customer_name,o.phone,o.city].join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('content').innerHTML=`<div class="panel"><div class="row"><div class="actions"><h2>${t('orders')}</h2><button class="btn gold" onclick="manualOrderView()">＋ ${t('manual')}</button></div><input class="search" value="${esc(q)}" placeholder="${t('search')}" oninput="window.orderSearch=this.value;ordersView()"></div><div class="tableWrap"><table class="table"><thead><tr><th>#</th><th>${t('customer')}</th><th>${t('total')}</th><th>${t('shippingCost')}</th><th>${t('status')}</th><th>${t('date')}</th><th></th></tr></thead><tbody>${listO.map(o=>`<tr><td><b>${esc(o.order_number||o.id)}</b></td><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.whatsapp||'')}</td><td>${money(o.total)}</td><td>${money(o.shipping_cost)}</td><td><select onchange="changeOrderStatus('${o.id}',this.value)">${['new','processing','shipped','delivered','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusText(s)}</option>`).join('')}</select></td><td>${new Date(o.created_at).toLocaleString(lang==='ar'?'ar-EG':'en-US')}</td><td><button class="btn" onclick="orderDetail('${o.id}')">${t('details')}</button> <button class="btn" onclick="downloadOrderPdf('${o.id}')">${t('pdf')}</button> <button class="btn danger" onclick="deleteOrder('${o.id}')">${t('deleteOrder')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">${t('noData')}</td></tr>`}</tbody></table></div></div>`}
function statusText(s){return ({new:t('new'),processing:t('processing'),shipped:t('shipped'),delivered:t('delivered'),cancelled:t('cancelled')})[s]||s}
async function changeOrderStatus(id,status){try{await api('orders:update',{id,patch:{status,updated_at:new Date().toISOString()}});await ordersView()}catch(e){alert(e.message)}}
async function deleteOrder(id){if(!confirm(t('confirmDelete')))return;try{await api('orders:delete',{id});await ordersView()}catch(e){alert(e.message==='CANCEL_ORDER_BEFORE_DELETE'?(lang==='ar'?'الغِ الطلب أولًا ثم احذفه للحفاظ على المخزون.':'Cancel the order first, then delete it to preserve stock.'):e.message)}}
function orderDetail(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;const items=parseItems(o);const map=o.map_url||(o.latitude&&o.longitude?`https://www.google.com/maps?q=${o.latitude},${o.longitude}`:'');document.getElementById('content').innerHTML=`<div class="panel"><div class="row"><h2>${esc(o.order_number||'Order')}</h2><button class="btn" onclick="ordersView()">${t('orders')}</button></div><div class="grid2"><div class="orderDetail"><b>${t('customer')}</b><br>${esc(o.customer_name)}<br>${esc(o.phone)}<br>WhatsApp: ${esc(o.whatsapp||'-')}</div><div class="orderDetail"><b>${t('map')}</b><br>${map?`<a class="mapLink" href="${esc(map)}" target="_blank">${t('open')} ↗</a>`:'-'}</div><div class="orderDetail"><b>${t('shipping')}</b><br>${esc(o.city)}<br>${esc(o.address)}</div><div class="orderDetail"><b>${t('total')}</b><br>${lang==='ar'?'طريقة الدفع':'Payment'}: ${esc(o.payment_method||'cod')}<br>${lang==='ar'?'مرجع الدفع':'Payment reference'}: ${esc(o.payment_reference||'-')}<br>Subtotal: ${money(o.subtotal)}<br>Discount: ${money(o.discount)}<br>Shipping: ${money(o.shipping_cost)}<br><strong>${money(o.total)}</strong></div></div><div class="tableWrap" style="margin-top:14px"><table class="table"><thead><tr><th>${t('products')}</th><th>${t('sizes')}</th><th>${t('colors')}</th><th>${t('quantity')}</th><th>${t('price')}</th><th>${t('total')}</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.name_ar||i.name_en||i.name)}</td><td>${esc(i.size||'-')}</td><td>${esc(i.color||'-')}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.line_total)}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn primary" onclick="downloadOrderPdf('${o.id}')">${t('pdf')}</button><button class="btn danger" onclick="deleteOrder('${o.id}')">${t('deleteOrder')}</button></div></div>`}
function makePdf(o){const items=parseItems(o);const rows=items.map(i=>`<tr><td>${esc(i.name_ar||i.name_en||i.name||'')}</td><td>${esc(i.size||'-')}</td><td>${esc(i.color||'-')}</td><td>${i.qty||1}</td><td>${money(i.price)}</td><td>${money(i.line_total)}</td></tr>`).join('');const el=document.createElement('div');el.className='pdf';el.innerHTML=`<div style="display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:15px;margin-bottom:20px"><div><div style="font-size:38px;font-weight:900;letter-spacing:8px">VANTA</div><div style="color:#666;letter-spacing:3px">MODERN UNISEX WEAR</div></div><div style="text-align:left"><b style="font-size:22px">${t('invoice')}</b><br>${esc(o.order_number||'')}<br>${new Date(o.created_at).toLocaleString(lang==='ar'?'ar-EG':'en-US')}</div></div><div style="line-height:2;margin-bottom:18px"><b>${t('customer')}:</b> ${esc(o.customer_name)} &nbsp; <b>Phone:</b> ${esc(o.phone)}<br><b>WhatsApp:</b> ${esc(o.whatsapp||'-')} &nbsp; <b>${t('city')}:</b> ${esc(o.city)}<br><b>${t('addressLabel')}:</b> ${esc(o.address)}${o.map_url?`<br><b>${t('map')}:</b> ${esc(o.map_url)}`:''}</div><table><thead><tr>${[t('products'),t('sizes'),t('colors'),t('quantity'),t('price'),t('total')].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table><div class="total" style="margin-right:auto;width:300px;line-height:2">Subtotal: <b>${money(o.subtotal)}</b><br>${t('discount')}: <b>${money(o.discount)}</b><br>${t('shippingCost')}: <b>${money(o.shipping_cost)}</b><br><strong>${t('total')}: ${money(o.total)}</strong></div><div style="text-align:center;margin-top:50px;color:#777">VANTA • Style has no gender.</div>`;document.body.appendChild(el);return el}
async function downloadOrderPdf(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;const el=makePdf(o);try{await new Promise(r=>setTimeout(r,150));await html2pdf().set({margin:0,filename:'VANTA-'+(o.order_number||'order')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#fff',logging:false,windowWidth:794,windowHeight:1123},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save()}catch(e){alert(e.message)}finally{el.remove()}}

async function customView(){await loadAll();document.getElementById('content').innerHTML=`<div class="panel"><h2>${t('custom')}</h2><div class="tableWrap"><table class="table"><thead><tr><th>${t('customer')}</th><th>${t('details')}</th><th>${t('deposit')}</th><th>${t('customFiles')}</th><th>${t('customStatus')}</th><th></th></tr></thead><tbody>${customRows.map(x=>`<tr><td>${esc(x.customer_name)}<br>${esc(x.phone)}<br>${esc(x.whatsapp)}</td><td>${esc(x.details)}<br>${esc(x.city)} - ${esc(x.address)}</td><td>${money(x.deposit)}<br>${esc(x.deposit_method||'')}<br>${esc(x.deposit_reference||'')}</td><td>${(Array.isArray(x.file_urls)?x.file_urls:[]).map(u=>u.startsWith('http')?`<a class="mapLink" href="${esc(u)}" target="_blank">${t('open')}</a>`:'').join(' ')}</td><td><select onchange="updateCustom('${x.id}',this.value)">${['new','processing','approved','printing','done','cancelled'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn danger" onclick="deleteCustom('${x.id}')">${t('deleteCustom')}</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">${t('noData')}</td></tr>`}</tbody></table></div></div>`}
async function updateCustom(id,status){await api('custom:update',{id,patch:{status,updated_at:new Date().toISOString()}})}async function deleteCustom(id){if(confirm(t('confirmDelete'))){await api('custom:delete',{id});customView()}}
async function settingsView(){await loadAll();const d=val('deposit_numbers',{});document.getElementById('content').innerHTML=`<div class="panel"><h2>⚙️ ${t('settings')}</h2><div class="grid2"><div class="field"><label>${t('newUsername')}</label><input id="newU" value=""></div><div class="field"><label>${t('newPassword')}</label><input id="newP" type="password"></div></div><button class="btn" onclick="saveCredentials()">${t('passwordChange')}</button><hr style="border-color:#222;margin:22px 0"><h3>💳 ${t('depositPage')}</h3><div class="grid2"><div class="field"><label>${t('vodafone')}</label><input id="dv" value="${esc(d.vodafone||'')}"></div><div class="field"><label>${t('instapay')}</label><input id="di" value="${esc(d.instapay||'')}"></div><div class="field"><label>${t('bank')}</label><input id="db" value="${esc(d.bank||'')}"></div><div class="field"><label>${t('instructions')}</label><textarea id="dins" rows="4">${esc(d.instructions||'')}</textarea></div></div><button class="btn gold" onclick="saveDeposit()">${t('save')}</button><div id="setMsg"></div><div class="notice">${lang==='ar'?'هذه الأرقام ستظهر للعميل في صفحة الديبوزت/الطباعة المخصصة.':'These numbers will be shown to customers on the deposit/custom-print payment area.'}</div></div><div class="panel"><h3>🔔 ${t('newOrder')}</h3><p class="muted">${t('clearRead')} يزيل الإشعارات المقروءة فقط.</p><button class="btn danger" onclick="clearNotifications()">${t('clearRead')}</button></div>`}
async function saveCredentials(){const u=document.getElementById('newU').value.trim(),p=document.getElementById('newP').value;if(!u&&!p)return;if(!u||!p)return alert('Enter both');await api('admin:credentials',{username:u,password:p});document.getElementById('setMsg').className='notice ok';document.getElementById('setMsg').textContent=t('credentialsSaved');setTimeout(logout,700)}
async function saveDeposit(){const d={vodafone_cash:document.getElementById('dv').value.trim(),instapay:document.getElementById('di').value.trim(),bank:document.getElementById('db').value.trim(),instructions:document.getElementById('dins').value.trim()};await api('settings:save',{values:{deposit_numbers:d}});document.getElementById('setMsg').className='notice ok';document.getElementById('setMsg').textContent=t('saved')}
async function clearNotifications(){await api('notifications:clear');loadTab()}
let pollTimer=null;function startPolling(){if(pollTimer)return;pollTimer=setInterval(async()=>{if(!token)return;try{const ns=await api('notifications:list');const fresh=ns.find(n=>!n.read);if(fresh){toast(t('newOrder'));await api('notifications:read',{id:fresh.id});if(tab==='orders'||tab==='dashboard')loadTab()}}catch(e){}},12000)}function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}
(async()=>{if(token)await boot();else renderLogin()})();
</script></body></html>
