  <section class="panel settingsSection" id="settings-account"><div class="settingsSectionHead"><div class="settingsSectionIcon">👤</div><div><h3>${ar?'الحساب والأمان':'Account & security'}</h3><p>${ar?'غيّر بيانات دخول لوحة الإدارة.':'Update your admin sign-in details.'}</p></div></div><div class="grid2"><div class="field"><label>${t('newUsername')}</label><input id="newU" autocomplete="username" placeholder="${ar?'اسم مستخدم جديد':'New username'}"></div><div class="field"><label>${t('newPassword')}</label><input id="newP" type="password" autocomplete="new-password" placeholder="${ar?'كلمة مرور جديدة':'New password'}"></div></div><button class="btn gold settingsSave" onclick="saveCredentials()">🔒 ${t('passwordChange')}</button><div id="setMsg"></div></section>
  <section class="panel settingsSection" id="settings-payments"><div class="settingsSectionHead"><div class="settingsSectionIcon">💳</div><div><h3>${ar?'بيانات الدفع والتحويل':'Payment details'}</h3><p>${ar?'البيانات التي تظهر للعميل عند الدفع أو التحويل.':'Payment details shown to customers.'}</p></div></div><div class="grid2"><div class="field"><label>${t('vodafone')}</label><input id="dv" inputmode="tel" value="${esc(d.vodafone_cash||d.vodafone||'')}"></div><div class="field"><label>${t('instapay')}</label><input id="di" inputmode="tel" value="${esc(d.instapay||'')}"></div><div class="field"><label>${t('bank')}</label><input id="db" value="${esc(d.bank||'')}"></div><div class="field"><label>${t('instructions')}</label><textarea id="dins" rows="3">${esc(d.instructions||'')}</textarea></div></div><button class="btn gold settingsSave" onclick="saveDeposit()">💾 ${t('save')}</button><div id="paymentMsg"></div></section>
  <section class="panel settingsSection" id="settings-store"><div class="settingsSectionHead"><div class="settingsSectionIcon">🏪</div><div><h3>${ar?'واجهة المتجر والتواصل':'Storefront & contact'}</h3><p>${ar?'حدّث شكل المتجر وطرق تواصل العملاء معك.':'Customize your storefront and customer contact options.'}</p></div></div><div class="grid2"><div class="field"><label>${ar?'شريط الإعلان أعلى المتجر':'Announcement bar'}</label><input id="storeAnnouncement" value="${esc(val('store_announcement',''))}" placeholder="${ar?'مثال: شحن مجاني لفترة محدودة':'Limited-time free shipping'}"></div><div class="field"><label>${ar?'الجملة تحت اسم VANTA':'Homepage tagline'}</label><input id="storeTagline" value="${esc(val('store_tagline','MODERN UNISEX WEAR'))}"></div><div class="field"><label>${ar?'عنوان مجموعة المنتجات':'Collection title'}</label><input id="storeCollection" value="${esc(val('store_collection_title','FALL / WINTER 2026'))}"></div><div class="field"><label>${ar?'رقم الاتصال بالمحل':'Store phone number'}</label><input id="storePhone" type="tel" inputmode="tel" value="${esc(val('support_phone',''))}" placeholder="+20..."></div><div class="field"><label>${ar?'رقم واتساب':'WhatsApp number'}</label><input id="storeWhatsApp" type="tel" inputmode="tel" value="${esc(val('whatsapp',''))}" placeholder="201..."></div><div class="field"><label>${ar?'رابط إنستجرام':'Instagram URL'}</label><input id="storeInstagram" type="url" value="${esc(val('instagram_url',''))}" placeholder="https://instagram.com/..."></div><div class="field"><label>${ar?'بريد خدمة العملاء':'Support email'}</label><input id="storeEmail" type="email" value="${esc(val('support_email',''))}"></div><div class="field"><label>${ar?'سياسة الاستبدال والاسترجاع':'Returns policy'}</label><textarea id="storeReturns" rows="3">${esc(val('return_policy',''))}</textarea></div></div><button class="btn gold settingsSave" onclick="saveStorefrontSettings()">💾 ${t('save')}</button><div id="storeMsg"></div></section>
  <section class="panel settingsSection"><div class="settingsSectionHead"><div class="settingsSectionIcon">🧥</div><div><h3>${ar?'إعدادات الطقم':'Bundle settings'}</h3><p>${ar?'السماح للعميل بشراء الهودي والبنطلون كطقم أو كل قطعة وحدها.':'Allow customers to buy the hoodie and pants separately or together.'}</p></div></div><div class="field"><label>${ar?'اختيار الهودي والبنطلون كطقم':'Hoodie and pants bundle'}</label><select id="bundleEnabled"><option value="true" ${val('bundle_enabled',false)===true?'selected':''}>ON</option><option value="false" ${val('bundle_enabled',false)!==true?'selected':''}>OFF</option></select></div><button class="btn gold settingsSave" onclick="saveBundleSettings()">💾 ${ar?'حفظ إعداد الطقم':'Save bundle settings'}</button><div id="bundleMsg"></div></section>
  <section class="panel settingsSection settingsAlerts" id="settings-alerts"><div class="settingsSectionHead"><div class="settingsSectionIcon">🔔</div><div><h3>${ar?'تنبيهات الطلبات الجديدة':'New order alerts'}</h3><p>${ar?'فعّل إشعارات النظام حتى تلاحظ الطلبات بسرعة.':'Enable system notifications so you notice orders quickly.'}</p></div></div><div class="settingsStatus"><span class="settingsStatusDot"></span><div><b>${ar?'إشعارات الهاتف':'Phone notifications'}</b><small id="notifyPermissionText">${('Notification'in window&&Notification.permission==='granted')?(ar?'مفعّلة على هذا المتصفح':'Enabled in this browser'):(ar?'تحتاج إلى السماح من المتصفح':'Permission required from your browser')}</small></div></div><button class="btn gold settingsSave" onclick="enableBrowserNotifications()">🔔 ${ar?'تفعيل إشعارات الهاتف':'Enable phone notifications'}</button><button class="btn settingsSave" onclick="testBrowserNotification()">اختبار الإشعار · Test</button><div id="browserNoticeMsg" class="notice settingsNotice">${ar?'بعد التفعيل، ستظهر التنبيهات عندما تكون لوحة الإدارة تعمل. للتنبيه أثناء إغلاق التطبيق بالكامل نحتاج إعداد خدمة Push بالخلفية.':'After enabling, alerts appear while the admin dashboard is running. Push delivery while the app is fully closed requires background push service setup.'}</div><button class="btn danger settingsSave" onclick="clearNotifications()">🧹 ${t('clearRead')}</button></section>

<section class="panel settingsSection" id="settings-staff" style="${role==='owner'?'':'display:none'}"><div class="settingsSectionHead"><div class="settingsSectionIcon">👥</div><div><h3>إدارة الموظفين</h3><p>أضف مستخدمًا وحدد الصلاحيات المتاحة له.</p></div></div><div class="grid2"><div class="field"><label>اسم المستخدم</label><input id="staffUsername" autocomplete="off" placeholder="اسم المستخدم"></div><div class="field"><label>كلمة المرور (8 أحرف على الأقل)</label><input id="staffPassword" type="password" autocomplete="new-password" placeholder="كلمة مرور قوية"></div></div><div class="grid2"><label><input type="checkbox" id="permOrdersView" checked> مشاهدة الطلبات</label><label><input type="checkbox" id="permOrdersStatus"> تغيير حالة الطلب</label><label><input type="checkbox" id="permProductsManage"> إدارة المنتجات</label><label><input type="checkbox" id="permPricesManage"> تعديل الأسعار والخصومات</label></div><button class="btn gold settingsSave" onclick="createStaffUser()">＋ إضافة مستخدم</button><div id="staffMsg"></div><div id="staffList" style="margin-top:12px">جارٍ تحميل الموظفين…</div></section>
</div>`;updateNotificationStatus()}

async function loadStaffUsers(){const el=document.getElementById('staffList');if(!el||role!=='owner')return;try{const rows=await api('staff:list');el.innerHTML=rows.length?rows.map(x=>'<div class="panel" style="padding:12px;margin-top:8px"><b>'+esc(x.username)+'</b> — '+(x.active?'مفعّل':'موقوف')+'<div style="font-size:12px;margin:6px 0">'+Object.entries(x.permissions||{}).filter(([k,v])=>v).map(([k])=>({orders_view:'مشاهدة الطلبات',orders_status:'تغيير حالة الطلب',products_manage:'إدارة المنتجات',prices_manage:'تعديل الأسعار والخصومات'}[k]||k)).join('، ')+'</div><button class="btn" onclick="toggleStaffUser(\''+x.id+'\','+(!x.active)+')">'+(x.active?'إيقاف':'تفعيل')+'</button> <button class="btn" onclick="deleteStaffUser(\''+x.id+'\')">حذف</button></div>').join(''):'لا يوجد موظفون.'}catch(e){el.textContent='تعذر تحميل الموظفين: '+(e.message||e)}}
async function createStaffUser(){const msg=document.getElementById('staffMsg');try{const username=document.getElementById('staffUsername').value.trim(),password=document.getElementById('staffPassword').value;const permissions={orders_view:document.getElementById('permOrdersView').checked,orders_status:document.getElementById('permOrdersStatus').checked,products_manage:document.getElementById('permProductsManage').checked,prices_manage:document.getElementById('permPricesManage').checked};await api('staff:create',{username,password,permissions});document.getElementById('staffUsername').value='';document.getElementById('staffPassword').value='';msg.className='notice ok';msg.textContent='تمت إضافة المستخدم.';await loadStaffUsers()}catch(e){msg.className='notice err';msg.textContent=e.message||String(e)}}
async function toggleStaffUser(id,active){try{await api('staff:update',{id,active});await loadStaffUsers()}catch(e){alert(e.message||String(e))}}
async function deleteStaffUser(id){if(!confirm('متأكد من حذف المستخدم؟'))return;try{await api('staff:delete',{id});await loadStaffUsers()}catch(e){alert(e.message||String(e))}}
async function saveCredentials(){const u=document.getElementById('newU').value.trim(),p=document.getElementById('newP').value;if(!u&&!p)return;if(!u||!p)return alert('Enter both');await api('admin:credentials',{username:u,password:p});document.getElementById('setMsg').className='notice ok';document.getElementById('setMsg').textContent=t('credentialsSaved');setTimeout(logout,700)}
async function saveDeposit(){const m=document.getElementById('paymentMsg');try{const d={vodafone_cash:document.getElementById('dv').value.trim(),instapay:document.getElementById('di').value.trim(),bank:document.getElementById('db').value.trim(),instructions:document.getElementById('dins').value.trim()};await api('settings:save',{values:{deposit_numbers:d}});settings.deposit_numbers=d;if(m){m.className='notice ok';m.textContent=t('saved')}}catch(e){if(m){m.className='notice err';m.textContent=e.message||String(e)}}}
async function saveStorefrontSettings(){try{const values={support_phone:document.getElementById('storePhone').value.trim(),whatsapp:document.getElementById('storeWhatsApp').value.trim().replace(/\D/g,''),store_announcement:document.getElementById('storeAnnouncement').value.trim(),store_tagline:document.getElementById('storeTagline').value.trim(),store_collection_title:document.getElementById('storeCollection').value.trim(),instagram_url:document.getElementById('storeInstagram').value.trim(),support_email:document.getElementById('storeEmail').value.trim(),return_policy:document.getElementById('storeReturns').value.trim()};await api('settings:save',{values});Object.assign(settings,values);const m=document.getElementById('storeMsg');m.className='notice ok';m.textContent=t('saved')}catch(e){const m=document.getElementById('storeMsg');m.className='notice err';m.textContent=e.message}}
async function saveBundleSettings(){try{const enabled=document.getElementById("bundleEnabled").value==="true";await api("settings:save",{values:{bundle_enabled:enabled}});settings.bundle_enabled=enabled;const m=document.getElementById("bundleMsg");m.className="notice ok";m.textContent=t("saved")}catch(e){const m=document.getElementById("bundleMsg");m.className="notice err";m.textContent=e.message}}
async function clearNotifications(){await api('notifications:clear');loadTab()}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast(lang==='ar'?'تم تثبيت VANTA Admin كتطبيق':'VANTA Admin installed as an app')});
async function installVantaAdmin(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(_){}deferredInstallPrompt=null;return}if(window.matchMedia('(display-mode: standalone)').matches){alert(lang==='ar'?'التطبيق مثبت بالفعل على هاتفك.':'The app is already installed.');return}alert(lang==='ar'?'من قائمة Chrome اضغط «إضافة إلى الشاشة الرئيسية» لتثبيت لوحة VANTA كتطبيق.':'In Chrome, open the menu and choose “Add to Home screen” to install VANTA Admin.')}
async function registerVantaServiceWorker(){if(!('serviceWorker'in navigator))return null;try{return await navigator.serviceWorker.register('/sw.js',{scope:'/'})}catch(e){console.warn('VANTA service worker registration failed',e);return null}}
function updateNotificationStatus(){const el=document.getElementById('notifyPermissionText');if(!el)return;el.textContent=('Notification'in window&&Notification.permission==='granted')?(lang==='ar'?'مفعّلة على هذا المتصفح':'Enabled in this browser'):('Notification'in window&&Notification.permission==='denied')?(lang==='ar'?'محظورة — افتح إعدادات الموقع في Chrome':'Blocked — allow notifications in Chrome site settings'):(lang==='ar'?'تحتاج إلى السماح من المتصفح':'Permission required from your browser')}
async function enableBrowserNotifications(){const m=document.getElementById('browserNoticeMsg');try{if(!('Notification'in window)){if(m)m.textContent=lang==='ar'?'المتصفح لا يدعم إشعارات النظام.':'This browser does not support system notifications.';return}await registerVantaServiceWorker();const p=await Notification.requestPermission();updateNotificationStatus();if(m)m.textContent=p==='granted'?(lang==='ar'?'تم تفعيل الإشعارات. سيصلك التنبيه عند تشغيل لوحة الإدارة، ويمكنك تثبيتها على الشاشة الرئيسية.':'Notifications enabled. You will receive alerts while the admin dashboard is running; you can install it to your home screen.'):(lang==='ar'?'لم يتم السماح بالإشعارات. فعّلها من إعدادات الموقع في Chrome.':'Permission not granted. Enable notifications in Chrome site settings.')}catch(e){if(m)m.textContent=String(e.message||e)}}
async function testBrowserNotification(){if(!('Notification'in window)){alert(lang==='ar'?'المتصفح لا يدعم الإشعارات':'Notifications are not supported');return}if(Notification.permission!=='granted'){await enableBrowserNotifications();if(Notification.permission!=='granted')return}try{const reg=await registerVantaServiceWorker();if(reg)await reg.showNotification('VANTA — '+(lang==='ar'?'اختبار الإشعار':'Notification test'),{body:lang==='ar'?'الإشعارات تعمل على هذا الهاتف.':'Notifications are working on this phone.',icon:'/icon.svg',data:'/admin.html',tag:'vanta-test-'+Date.now()});else new Notification('VANTA',{body:lang==='ar'?'الإشعارات تعمل على هذا الهاتف.':'Notifications are working on this phone.'})}catch(e){alert(e.message||String(e))}}
let pollTimer=null;let pollBusy=false;let lastOrderAlertAt=Number(localStorage.getItem('vanta_last_order_alert_at')||0);let pollHasInitialized=false;async function checkOrderAlerts(){if(!token||pollBusy)return;pollBusy=true;try{const ns=await api('notifications:list');const list=Array.isArray(ns)?ns:[];const unread=list.filter(n=>!n.read&&n.type==='order');const now=Date.now();if(!pollHasInitialized){pollHasInitialized=true;if(!lastOrderAlertAt){lastOrderAlertAt=now;localStorage.setItem('vanta_last_order_alert_at',String(now));return}}const fresh=unread.filter(n=>{const time=Date.parse(n.created_at||'')||0;return time>lastOrderAlertAt});if(fresh.length){for(const n of fresh.reverse()){const title='VANTA — '+(lang==='ar'?'طلب جديد':'New order'),body=n.message||(lang==='ar'?'تم استلام طلب جديد؛ افتح لوحة الإدارة للتفاصيل.':'A new order was received. Open admin for details.');toast(body);if('Notification'in window&&Notification.permission==='granted'){const options={body,tag:'vanta-order-'+n.id,icon:'/icon.svg',data:'/admin.html?order='+encodeURIComponent(n.order_id||''),requireInteraction:true};try{const reg=await registerVantaServiceWorker();if(reg)await reg.showNotification(title,options);else new Notification(title,options)}catch(e){console.warn('Could not show order notification',e)}}try{await api('notifications:read',{id:n.id})}catch(e){console.warn('Could not mark notification read',e)}}lastOrderAlertAt=Math.max(now,...fresh.map(n=>Date.parse(n.created_at||'')||now));localStorage.setItem('vanta_last_order_alert_at',String(lastOrderAlertAt));if(tab==='orders'||tab==='dashboard')loadTab()}else{lastOrderAlertAt=Math.max(lastOrderAlertAt,...list.map(n=>Date.parse(n.created_at||'')||0));localStorage.setItem('vanta_last_order_alert_at',String(lastOrderAlertAt))}}catch(e){console.warn('VANTA order alert polling failed',e)}finally{pollBusy=false}}function startPolling(){if(pollTimer)return;registerVantaServiceWorker();checkOrderAlerts();pollTimer=setInterval(checkOrderAlerts,4000)}function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}
(async()=>{if(token)await boot();else renderLogin()})();
</script></body></html>
