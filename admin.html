,ordersCount:'Orders',addProduct:'Add New Product',editProduct:'Edit Product',nameAr:'Arabic product name',nameEn:'English product name',descAr:'Arabic description',descEn:'English description',price:'Price',sale:'Sale price',stockBase:'Base stock',category:'Category',sizes:'Sizes',colors:'Colors',images:'Product images',upload:'Upload images',save:'Save Product',new:'New Product',delete:'Delete',active:'Active',inactive:'Hidden',settingsSaved:'Settings saved',free:'Free shipping minimum',whatsapp:'WhatsApp number',rates:'Shipping rates by governorate',saveSettings:'Save Settings',choose:'Choose',ordersLoad:'Could not load orders',customLoad:'Could not load custom print requests',session:'A Supabase admin session is required to manage orders and inventory.',connected:'Supabase session connected',notConnected:'No Supabase session',back:'Back to store',status:'Status',customer:'Customer',total:'Total',date:'Date',items:'Items',files:'Files',deposit:'Deposit',noData:'No data',imageUrl:'Additional image URL (optional)',slug:'Slug (optional)',manual:'Add image URLs manually',uploading:'Uploading images...',saved:'Product saved successfully',deleted:'Product deleted',confirmDelete:'Delete this product?',lang:'AR'}};
function t(k){return T[lang][k]||k}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return Number(n||0).toLocaleString(lang==='ar'?'ar-EG':'en-US',{maximumFractionDigits:2})+' EGP'}
function getList(v){if(Array.isArray(v))return v.map(String).filter(Boolean);if(typeof v==='string'){try{let x=JSON.parse(v);if(Array.isArray(x))return x.map(String).filter(Boolean)}catch(e){}return v.split(',').map(x=>x.trim()).filter(Boolean)}return []}
function loginView(msg=''){return `<div class="panel login"><div class="loginLogo"><b>VANTA</b><div class="eyebrow">ADMIN CONTROL</div></div><div class="field"><label>${t('user')}</label><input id="u" value=""></div><div class="field" style="margin-top:12px"><label>${t('pass')}</label><input id="p" type="password"></div><button class="btn primary wide" style="margin-top:15px" onclick="login()">${t('enter')}</button>${msg?`<div class="notice err">${msg}</div>`:''}</div>`}
function login(){if(document.getElementById('u').value.trim()===USER&&document.getElementById('p').value===PASS){localStorage.setItem('vanta_admin_gate','1');render()}else render(loginView(t('bad')))}
function logout(){localStorage.removeItem('vanta_admin_gate');render()}
async function initSession(){try{const c=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const r=await c.auth.getSession();session=r.data.session||null}catch(e){session=null}}
function shell(){return `<div class="shell"><aside class="side"><div class="brand"><b>VANTA</b><span>MODERN UNISEX WEAR</span></div><div class="nav">${[['dashboard','◈'],['orders','▣'],['products','◆'],['inventory','▤'],['custom','✦'],['settings','⚙']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]} &nbsp; ${t(x[0])}</button>`).join('')}</div><div class="sideBottom"><button class="btn wide" onclick="location.href='index.html'">← ${t('back')}</button><button class="lang" onclick="lang=lang==='ar'?'en':'ar';localStorage.setItem('vanta_admin_lang',lang);render()">${t('lang')}</button><button class="btn danger wide" style="margin-top:8px" onclick="logout()">${t('logout')}</button></div></aside><main class="main"><div class="topbar"><div><div class="eyebrow">${t('welcome')}</div><div class="title">${t(tab)}</div><div class="sub">${t('overview')}</div></div><div class="pill">${session?t('connected'):t('notConnected')}</div></div><div id="content"></div></main></div>`}
async function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(localStorage.getItem('vanta_admin_gate')!=='1'){document.getElementById('root').innerHTML=loginView();return}await initSession();document.getElementById('root').innerHTML=shell();if(tab==='dashboard')dashboard();if(tab==='orders')orders();if(tab==='products')productsView();if(tab==='inventory')inventory();if(tab==='custom')custom();if(tab==='settings')settings()}
async function api(path,opts={}){const c=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:{session:s}}=await c.auth.getSession();const h={...HEADERS,Authorization:`Bearer ${s?.access_token||SUPABASE_KEY}`};return fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{...h,...(opts.headers||{})}})}
async function loadProducts(){try{const r=await api('products?select=*&order=created_at.desc');if(!r.ok)throw Error(await r.text());products=await r.json()}catch(e){products=[]}}
async function dashboard(){await loadProducts();let ord=0;try{const r=await api('orders?select=id&limit=1000');if(r.ok)ord=(await r.json()).length}catch(e){}const active=products.filter(x=>x.active!==false).length;const stock=products.reduce((s,p)=>s+Number(p.stock||0),0);document.getElementById('content').innerHTML=`<div class="cards"><div class="stat"><div>${t('totalProducts')}</div><div class="n">${products.length}</div></div><div class="stat"><div>${t('activeProducts')}</div><div class="n">${active}</div></div><div class="stat"><div>${t('stock')}</div><div class="n">${stock}</div></div><div class="stat"><div>${t('ordersCount')}</div><div class="n">${ord}</div></div></div><div class="panel"><h2>VANTA</h2><p class="sub">${session?t('connected'):t('session')}</p><div class="actions"><button class="btn primary" onclick="tab='products';render()">${t('addProduct')}</button><button class="btn" onclick="tab='settings';render()">${t('settings')}</button></div></div>`}
function productForm(p={}){editId=p.id||null;return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${p.id?t('editProduct'):t('addProduct')}</h2><button class="btn" onclick="editId=null;productsView()">${t('new')}</button></div><div class="grid2"><div class="field"><label>${t('nameAr')}</label><input id="pn_ar" value="${esc(p.name_ar||p.name||'')}"></div><div class="field"><label>${t('nameEn')}</label><input id="pn_en" value="${esc(p.name_en||'')}"></div><div class="field"><label>${t('descAr')}</label><textarea id="pd_ar" rows="4">${esc(p.description_ar||p.description||'')}</textarea></div><div class="field"><label>${t('descEn')}</label><textarea id="pd_en" rows="4">${esc(p.description_en||'')}</textarea></div><div class="field"><label>${t('price')}</label><input id="pp" type="number" step="0.01" value="${Number(p.price||0)}"></div><div class="field"><label>${t('sale')}</label><input id="ps" type="number" step="0.01" value="${Number(p.sale_price||0)}"></div><div class="field"><label>${t('stockBase')}</label><input id="pst" type="number" value="${Number(p.stock||0)}"></div><div class="field"><label>${t('category')}</label><input id="pc" value="${esc(p.category||'')}"></div><div class="field"><label>${t('sizes')}</label><input id="psizes" value="${esc(getList(p.sizes).join(', '))}"></div><div class="field"><label>${t('colors')}</label><input id="pcolors" value="${esc(getList(p.colors).join(', '))}"></div><div class="field"><label>${t('slug')}</label><input id="pslug" value="${esc(p.slug||'')}"></div><div class="field"><label>${t('active')}</label><select id="pactive"><option value="true" ${p.active!==false?'selected':''}>${t('active')}</option><option value="false" ${p.active===false?'selected':''}>${t('inactive')}</option></select></div></div><div class="panel" style="margin-top:14px;background:#0b0b0b"><h3>${t('images')}</h3><div class="drop"><div>${t('upload')}</div><input id="pfiles" type="file" accept="image/*" multiple onchange="previewFiles()"><div id="preview" class="preview"></div></div><div class="field" style="margin-top:12px"><label>${t('imageUrl')}</label><input id="purl" placeholder="https://..."></div><p class="sub">${t('manual')}: يمكنك وضع رابط مباشر لصورة أو رفع عدة صور.</p></div><div class="actions"><button class="btn gold" onclick="saveProduct()">${t('save')}</button>${p.id?`<button class="btn danger" onclick="deleteProduct('${esc(p.id)}')">${t('delete')}</button>`:''}</div><div id="productMsg"></div></div>`}
function previewFiles(){const files=[...(document.getElementById('pfiles')?.files||[])];document.getElementById('preview').innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')}
async function uploadImages(){const files=[...(document.getElementById('pfiles')?.files||[])];const urls=[];for(const f of files){const path=`products/${Date.now()}-${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;const r=await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${session?.access_token||SUPABASE_KEY}`,'Content-Type':f.type||'image/jpeg'},body:f});if(!r.ok)throw Error(await r.text());urls.push(`${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`)}const manual=document.getElementById('purl').value.trim();if(manual)urls.push(manual);return urls}
async function saveProduct(){const m=document.getElementById('productMsg');try{const imgs=await uploadImages();const old=editId?products.find(x=>x.id===editId):null;const oldImgs=getList(old?.image_urls);const all=[...oldImgs,...imgs].filter((x,i,a)=>a.indexOf(x)===i);const payload={name_ar:document.getElementById('pn_ar').value.trim(),name_en:document.getElementById('pn_en').value.trim(),name:document.getElementById('pn_ar').value.trim()||document.getElementById('pn_en').value.trim(),description_ar:document.getElementById('pd_ar').value.trim(),description_en:document.getElementById('pd_en').value.trim(),price:Number(document.getElementById('pp').value||0),sale_price:Number(document.getElementById('ps').value||0),stock:Number(document.getElementById('pst').value||0),category:document.getElementById('pc').value.trim(),sizes:document.getElementById('psizes').value.split(',').map(x=>x.trim()).filter(Boolean),colors:document.getElementById('pcolors').value.split(',').map(x=>x.trim()).filter(Boolean),slug:document.getElementById('pslug').value.trim()||null,active:document.getElementById('pactive').value==='true',image_urls:all,image_url:all[0]||old?.image_url||null};if(!payload.name)throw Error('name');let r;if(editId)r=await api(`products?id=eq.${encodeURIComponent(editId)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});else r=await api('products',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});if(!r.ok)throw Error(await r.text());m.className='notice ok';m.textContent=t('saved');await loadProducts();setTimeout(()=>{editId=null;productsView()},500)}catch(e){console.error(e);m.className='notice err';m.textContent=e.message||'Error'}}
async function deleteProduct(id){if(!confirm(t('confirmDelete')))return;const r=await api(`products?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});if(!r.ok){alert(await r.text());return}editId=null;await loadProducts();productsView()}
async function productsView(){await loadProducts();const c=document.getElementById('content');if(editId){c.innerHTML=productForm(products.find(x=>x.id===editId)||{});return}c.innerHTML=`<div class="panel"><div class="actions" style="justify-content:space-between;align-items:center;margin-top:0"><h2>${t('products')}</h2><button class="btn gold" onclick="editId=null;document.getElementById('content').innerHTML=productForm({})">＋ ${t('addProduct')}</button></div><div class="tableWrap"><table class="table"><thead><tr><th>${t('images')}</th><th>${t('nameEn')}</th><th>${t('price')}</th><th>${t('stock')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:''}</td><td><b>${esc(p.name_en||p.name||'')}</b><br><span class="sub">${esc(p.name_ar||'')}</span></td><td>${money(p.sale_price>0&&p.sale_price<p.price?p.sale_price:p.price)}</td><td>${Number(p.stock||0)}</td><td><span class="pill">${p.active!==false?t('active'):t('inactive')}</span></td><td><button class="btn" onclick="editId='${esc(p.id)}';productsView()">${t('editProduct')}</button></td></tr>`).join('')||`<tr><td colspan="6">${t('noData')}</td></tr>`}</tbody></table></div></div>`}
async function orders(){const c=document.getElementById('content');if(!session){c.innerHTML=`<div class="panel"><h2>${t('orders')}</h2><div class="notice">${t('session')}</div></div>`;return}try{const r=await api('orders?select=*&order=created_at.desc&limit=100');if(!r.ok)throw Error();const rows=await r.json();c.innerHTML=`<div class="panel"><h2>${t('orders')}</h2><div class="tableWrap"><table class="table"><thead><tr><th>#</th><th>${t('customer')}</th><th>${t('items')}</th><th>${t('total')}</th><th>${t('status')}</th><th>${t('date')}</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.order_number||o.id)}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.whatsapp||'')}</td><td>${(Array.isArray(o.items)?o.items:[]).map(i=>`${esc(i.name||'')} × ${i.qty||1}`).join('<br>')}</td><td>${money(o.total)}</td><td>${esc(o.status||'new')}</td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`).join('')||`<tr><td colspan="6">${t('noData')}</td></tr>`}</tbody></table></div></div>`}catch(e){c.innerHTML=`<div class="panel"><div class="notice err">${t('ordersLoad')}</div></div>`}}
async function inventory(){await loadProducts();document.getElementById('content').innerHTML=`<div class="panel"><h2>${t('inventory')}</h2><div class="tableWrap"><table class="table"><thead><tr><th>${t('nameEn')}</th><th>${t('sizes')}</th><th>${t('colors')}</th><th>${t('stock')}</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name_en||p.name||'')}</td><td>${esc(getList(p.sizes).join(', '))}</td><td>${esc(getList(p.colors).join(', '))}</td><td>${Number(p.stock||0)}</td></tr>`).join('')}</tbody></table></div></div>`}
async function custom(){const c=document.getElementById('content');if(!session){c.innerHTML=`<div class="panel"><h2>${t('custom')}</h2><div class="notice">${t('session')}</div></div>`;return}try{const r=await api('custom_print_orders?select=*&order=created_at.desc&limit=100');if(!r.ok)throw Error();const rows=await r.json();c.innerHTML=`<div class="panel"><h2>${t('custom')}</h2><div class="tableWrap"><table class="table"><thead><tr><th>${t('customer')}</th><th>Details</th><th>${t('deposit')}</th><th>${t('files')}</th><th>${t('status')}</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.customer_name)}<br>${esc(o.phone)}<br>${esc(o.whatsapp)}</td><td>${esc(o.details)}</td><td>${money(o.deposit)}</td><td>${(Array.isArray(o.file_urls)?o.file_urls:[]).map(u=>u.startsWith('http')?`<a href="${esc(u)}" target="_blank" style="color:#fff">${t('files')}</a>`:'').join('<br>')}</td><td>${esc(o.status||'new')}</td></tr>`).join('')||`<tr><td colspan="5">${t('noData')}</td></tr>`}</tbody></table></div></div>`}catch(e){c.innerHTML=`<div class="panel"><div class="notice err">${t('customLoad')}</div></div>`}}
async function settings(){const c=document.getElementById('content');let free=1500,wa='201000000000',rates={};try{const r=await api('site_settings?select=key,value');if(r.ok){for(const x of await r.json()){if(x.key==='free_shipping_min')free=Number(x.value)||1500;if(x.key==='whatsapp')wa=x.value||wa;if(x.key==='shipping_rates')rates=x.value||{}}}}catch(e){}c.innerHTML=`<div class="panel"><h2>${t('settings')}</h2><div class="grid2"><div class="field"><label>${t('free')}</label><input id="sf" type="number" value="${free}"></div><div class="field"><label>${t('whatsapp')}</label><input id="sw" value="${esc(wa)}"></div></div><div class="field" style="margin-top:14px"><label>${t('rates')}</label><textarea id="sr" rows="14">${esc(JSON.stringify(rates,null,2))}</textarea></div><div class="actions"><button class="btn gold" onclick="saveSettings()">${t('saveSettings')}</button><button class="btn" onclick="tab='products';render()">${t('addProduct')}</button></div><div id="sm"></div></div><div class="panel"><h2>${t('images')}</h2><p class="sub">${t('overview')}</p><button class="btn primary" onclick="tab='products';render()">${t('addProduct')}</button></div>`}
async function saveSettings(){const m=document.getElementById('sm');try{const rates=JSON.parse(document.getElementById('sr').value);const vals={free_shipping_min:Number(document.getElementById('sf').value||1500),whatsapp:document.getElementById('sw').value.trim(),shipping_rates:rates};for(const [key,value] of Object.entries(vals)){const r=await api(`site_settings?key=eq.${encodeURIComponent(key)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({value})});if(!r.ok)throw Error(await r.text())}m.className='notice ok';m.textContent=t('settingsSaved')}catch(e){m.className='notice err';m.textContent=lang==='ar'?'تعذر حفظ الإعدادات':'Could not save settings'}}
render();
</script>
</body>
</html>
