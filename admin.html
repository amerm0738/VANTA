*{

body{

button{

.hidden{

/* LOGIN */

.loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:420px;
  padding:35px;
  background:
    linear-gradient(
      145deg,
      #161616,

    );
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:

}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logoTitle{
  font-size:48px;
  letter-spacing:10px;
  font-weight:900;
}

.logoSub{
  color:var(--gold);
  font-size:10px;
  letter-spacing:4px;
  margin-top:8px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#ccc;
  font-size:13px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #333;
  outline:none;
  background:#080808;
  color:#fff;
}

.field input:focus,
.field textarea:focus,
.field select:focus{

}

.btn{
  border:1px solid #333;
  background:#181818;
  color:#fff;
  padding:11px 16px;
  border-radius:11px;
}

.btn:hover{

}

.btnPrimary{

  color:#000;

}

.btnGold{

.btnDanger{

  margin-top:15px;
  padding:12px;
  border-radius:12px;
  color:#ffabab;
  background:#211010;
  border:1px solid #552323;
}


/* APP */

  grid-template-columns:250px 1fr;

}

.sidebar{

  top:0;
  height:100vh;

.brand strong{

  letter-spacing:7px;
}

.brand small{

  font-size:9px;

.sidebarBottom{

.muted{

/* =====================================================
   HELPERS
===================================================== */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function money(value){

  return Number(
    value || 0
  ).toLocaleString(
    lang === "ar"
    ? "ar-EG"
    : "en-US"
  ) + " EGP";

}


function arr(value){

  if(Array.isArray(value))
    return value;

  if(typeof value === "string"){

    try{

      const parsed =
        JSON.parse(value);

      if(Array.isArray(parsed))
        return parsed;

    }catch(e){}

    return value
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);

  }

  return [];

}

/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  if(!email || !password){

    document
      .getElementById("root")
      .innerHTML =
        loginPage(
          t("invalid")
        );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(error){

    document
      .getElementById("root")
      .innerHTML =
        loginPage(
          t("invalid")
        );

    return;

  }


  session =
    data.session;


  adminUser =
    data.user;


  /*
    التأكد أن الحساب موجود
    في جدول admins.
  */

  const {
    data:admin,
    error:adminError
  } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq(
        "user_id",
        adminUser.id
      )
      .maybeSingle();


  if(
    adminError ||
    !admin
  ){

    await supabaseClient
      .auth
      .signOut();


    session = null;

    adminUser = null;


    document
      .getElementById("root")
      .innerHTML =
        loginPage(
          t("adminOnly")
        );

    return;

  }


  await render();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient
    .auth
    .signOut();


  session = null;

  adminUser = null;

  products = [];

  variants = [];

  editId = null;

  currentTab = "dashboard";


  document
    .getElementById("root")
    .innerHTML =
      loginPage();

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  if(!data.session){

    session = null;

    adminUser = null;

    document
      .getElementById("root")
      .innerHTML =
        loginPage();

    return false;

  }


  session =
    data.session;

  adminUser =
    data.session.user;


  const {
    data:admin
  } =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq(
        "user_id",
        adminUser.id
      )
      .maybeSingle();


  if(!admin){

    await logout();

    return false;

  }


  return true;

}


/* =====================================================
   API
===================================================== */

async function api(
  table,
  options={}
){

  if(!session){

    throw new Error(
      "NO_ADMIN_SESSION"
    );

  }


  const token =
    session.access_token;


  const headers = {

    apikey:
      SUPABASE_KEY,

    Authorization:
      "Bearer " + token,

    "Content-Type":
      "application/json",

    Accept:
      "application/json"

  };


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      (
        options.query
        ?
        "?" + options.query
        :
        ""
      ),
      {
        method:
          options.method || "GET",

        headers,

        body:
          options.body
          ?
          JSON.stringify(
            options.body
          )
          :
          undefined
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      text ||
      "API_ERROR"
    );

  }


  if(!text)
    return null;


  try{

    return JSON.parse(text);

  }catch(e){

    return text;

  }

}


/* =====================================================
   RENDER
===================================================== */

async function render(){

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === "ar"
    ? "rtl"
    : "ltr";


  /*
    مهم:

    لا localStorage
    لا sessionStorage
    لا admin gate.

    الجلسة موجودة في الذاكرة فقط.
  */

  if(!session){

    document
      .getElementById("root")
      .innerHTML =
        loginPage();

    return;

  }


  document
    .getElementById("root")
    .innerHTML =
      appShell();


  if(
    currentTab ===
    "dashboard"
  )
    await dashboard();


  if(
    currentTab ===
    "orders"
  )
    await orders();


  if(
    currentTab ===
    "products"
  )
    await productsView();


  if(
    currentTab ===
    "inventory"
  )
    await inventory();


  if(
    currentTab ===
    "custom"
  )
    await custom();


  if(
    currentTab ===
    "settings"
  )
    await settings();

}

}

/* =====================================================
   UPLOAD PRODUCT IMAGES
===================================================== */

async function uploadProductImages(){

  const files =
    [
      ...(
        document
          .getElementById(
            "imageFiles"
          )
          ?.files || []
      )
    ];


  const urls = [];


  for(
    const file
    of files
  ){

    const safe =
      file.name.replace(
        /[^\w.\-]+/g,
        "_"
      );


    const path =
      "products/" +
      Date.now() +
      "-" +
      crypto.randomUUID() +
      "-" +
      safe;


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          "product-images"
        )
        .upload(
          path,
          file,
          {
            upsert:false,
            contentType:
              file.type
          }
        );


    if(error)
      throw error;


    urls.push(

      SUPABASE_URL +
      "/storage/v1/object/public/product-images/" +
      data.path

    );

  }


  const manual =
    document
      .getElementById(
        "imageUrl"
      )
      .value
      .trim();


  if(manual)
    urls.push(manual);


  return urls;

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(
  id
){

  const message =
    document
      .getElementById(
        "productMessage"
      );


  try{

    const old =
      id
      ?
      products.find(
        p =>
          String(p.id) ===
          String(id)
      )
      :
      null;


    const newImages =
      await uploadProductImages();


    const oldImages =
      arr(
        old?.image_urls
      );


    const imageUrls =
      [
        ...oldImages,
        ...newImages
      ].filter(
        (x,i,a) =>
          a.indexOf(x) === i
      );


    const nameAr =
      document
        .getElementById(
          "name_ar"
        )
        .value
        .trim();


    const nameEn =
      document
        .getElementById(
          "name_en"
        )
        .value
        .trim();


    const payload = {

      name:
        nameAr ||
        nameEn,

      name_ar:
        nameAr,

      name_en:
        nameEn,

      description_ar:
        document
          .getElementById(
            "description_ar"
          )
          .value
          .trim(),

      description_en:
        document
          .getElementById(
            "description_en"
          )
          .value
          .trim(),

      price:
        Number(
          document
            .getElementById(
              "price"
            )
            .value || 0
        ),

      sale_price:
        Number(
          document
            .getElementById(
              "sale_price"
            )
            .value || 0
        ),

      stock:
        Number(
          document
            .getElementById(
              "stock"
            )
            .value || 0
        ),

      category:
        document
          .getElementById(
            "category"
          )
          .value
          .trim(),

      sizes:
        document
          .getElementById(
            "sizes"
          )
          .value
          .split(",")
          .map(
            x =>
              x.trim()
          )
          .filter(Boolean),

      colors:
        document
          .getElementById(
            "colors"
          )
          .value
          .split(",")
          .map(
            x =>
              x.trim()
          )
          .filter(Boolean),

      slug:
        document
          .getElementById(
            "slug"
          )
          .value
          .trim() ||
        null,

      active:
        document
          .getElementById(
            "active"
          )
          .value ===
        "true",

      image_urls:
        imageUrls,

      image_url:
        imageUrls[0] ||
        old?.image_url ||
        null

    };


    if(!payload.name){

      throw new Error(
        lang === "ar"
        ?
        "اكتب اسم المنتج"
        :
        "Enter product name"
      );

    }


    if(id){

      await api(
        "products?id=eq." +
        encodeURIComponent(id),
        {
          method:"PATCH",
          body:payload
        }
      );

    }else{

      await api(
        "products",
        {
          method:"POST",
          body:payload
        }
      );

    }


    message.className =
      "notice ok";

    message.textContent =
      t("saved");


    await loadProducts();


    setTimeout(
      ()=>{
        editId = null;
        currentTab = "products";
        render();
      },
      500
    );


  }catch(error){

    console.error(error);


    message.className =
      "notice error";


    message.textContent =
      error.message ||
      t("error");

  }

}

async function deleteProduct(

){

  try{

    );

/* =====================================================
   SETTINGS
===================================================== */

async function settings(){

  const content =
    document.getElementById(
      "content"
    );


  try{

    const rows =
      await api(
        "site_settings",
        {
          query:
            "select=key,value"
        }
      ) || [];


    let freeShipping = 1500;

    let whatsapp =
      "201000000000";

    let rates = {};


    for(
      const row
      of rows
    ){

      if(
        row.key ===
        "free_shipping_min"
      ){

        freeShipping =
          Number(
            row.value
          ) || 1500;

      }


      if(
        row.key ===
        "whatsapp"
      ){

        whatsapp =
          row.value ||
          whatsapp;

      }


      if(
        row.key ===
        "shipping_rates"
      ){

        rates =
          row.value ||
          {};

      }

    }


    content.innerHTML = `

    <div class="panel">

      <h2 class="panelTitle">
        ${t("settings")}
      </h2>


      <div class="grid2">


        <div class="field">

          <label>
            ${t("freeShipping")}
          </label>

          <input
            id="freeShipping"
            type="number"
            value="${freeShipping}"
          >

        </div>


        <div class="field">

          <label>
            ${t("whatsapp")}
          </label>

          <input
            id="whatsapp"
            value="${esc(
              whatsapp
            )}"
          >

        </div>


      </div>


      <div
        class="field"
        style="margin-top:15px"
      >

        <label>
          ${t("shippingRates")}
        </label>

        <textarea
          id="shippingRates"
          rows="16"
        >${esc(
          JSON.stringify(
            rates,
            null,
            2
          )
        )}</textarea>

      </div>


      <div class="actions">

        <button
          class="btn btnGold"
          onclick="
            saveSettings()
          "
        >
          ${t("saveSettings")}
        </button>

      </div>


      <div id="settingsMessage"></div>


    </div>

    `;


  }catch(error){

    content.innerHTML = `

    <div class="panel">

      <div class="notice error">
        ${esc(
          error.message
        )}
      </div>

    </div>

    `;

  }

}


/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings(){

  const message =
    document.getElementById(
      "settingsMessage"
    );


  try{

    const freeShipping =
      Number(
        document
          .getElementById(
            "freeShipping"
          )
          .value
      );


    const whatsapp =
      document
        .getElementById(
          "whatsapp"
        )
        .value
        .trim();


    const rates =
      JSON.parse(
        document
          .getElementById(
            "shippingRates"
          )
          .value
      );


    const values = {

      free_shipping_min:
        freeShipping,

      whatsapp:
        whatsapp,

      shipping_rates:
        rates

    };


    for(
      const [key,value]
      of Object.entries(
        values
      )
    ){

      await api(
        "site_settings?key=eq." +
        encodeURIComponent(
          key
        ),
        {
          method:"PATCH",
          body:{
            value:value,
            updated_at:
              new Date()
                .toISOString()
          }
        }
      );

    }


    message.className =
      "notice ok";

    message.textContent =
      t("settingsSaved");


  }catch(error){

    message.className =
      "notice error";

    message.textContent =
      error.message ||
      t("error");

  }

}

   SECURITY:
   REFRESH = LOGIN AGAIN
===================================================== */

/*
  لا يوجد أي localStorage للجلسة.

  persistSession:false

  لذلك عند F5:

  session = null

  Supabase لن يسترجع Session.

  النتيجة:
  Login screen.
*/


window.addEventListener(
  "pageshow",
  async function(){

    /*
      لو الصفحة اتجابت من Browser Back/Forward Cache
      نعمل Sign Out برضه.
    */

    await supabaseClient
      .auth
      .signOut();


    session = null;

    adminUser = null;

    products = [];

    variants = [];

    editId = null;


    document
      .getElementById("root")
      .innerHTML =
        loginPage();

  }
);
